<div class="flex items-center gap-3">

<span class="label-font text-[10px] bg-tertiary-fixed text-on-tertiary-fixed px-2.5 py-0.5 rounded-full uppercase font-bold">已启用</span>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="bg-surface-container-lowest p-4 rounded-xl border border-primary/20 card-shadow flex justify-between items-center group cursor-pointer active:scale-[0.98] transition-transform">
<div>
<p class="label-font text-[10px] text-primary uppercase tracking-wider mb-1">源语言</p>
<p class="text-lg font-semibold text-on-surface">法语</p>

<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>

<div>

</div>
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</section>

<div class="space-y-3">
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest border border-outline-variant/30 rounded-xl hover:bg-surface-container-low transition-colors card-shadow">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container text-primary flex items-center justify-center font-bold text-xs label-font">EN</div>
<span class="font-medium">英语 (美国)</span>
</div>
<span class="material-symbols-outlined text-tertiary">star</span>
</button>

<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center font-bold text-xs label-font">JA</div>
<span class="font-medium">日语</span>
</div>
<span class="material-symbols-outlined text-outline">star</span>
</button>
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest border border-outline-variant/30 rounded-xl hover:bg-surface-container-low transition-colors card-shadow">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center font-bold text-xs label-font">KO</div>

</div>

</div>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 h-action-bar-height pb-safe bg-surface/95 backdrop-blur-md border-t border-outline-variant/30 shadow-[0_-4px_10px_rgba(0,0,0,0.03)]">
<button class="flex flex-col items-center justify-center text-primary px-6 py-1 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">photo_camera</span>

<span class="material-symbols-outlined">history</span>

</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-1 hover:text-primary transition-colors">
<span class="material-symbols-outlined">person</span>
<span class="label-font text-[10px] font-bold uppercase mt-1">我的</span>
</button>
</nav>
<script>
    const searchInput = document.querySelector('input[type="text"]');
    const languageItems = document.querySelectorAll('section div.divide-y > div');

    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        languageItems.forEach(item => {
            const text = item.querySelector('span').textContent.toLowerCase();
            if (text.includes(term)) {
                item.style.display = 'flex';
            } else {
                item.style.display = 'none';
            }
        });
        
        document.querySelectorAll('section').forEach(section => {
            const list = section.querySelector('div.divide-y');
            if (list) {
                const visibleItems = Array.from(list.children).filter(item => item.style.display !== 'none');
                if (visibleItems.length === 0 && term !== "") {
                    section.classList.add('hidden');
                } else {
                    section.classList.remove('hidden');
                }
            }
        });
    });

    languageItems.forEach(item => {
        item.addEventListener('click', () => {
            item.classList.add('bg-primary/5');
            setTimeout(() => {
                item.classList.remove('bg-primary/5');
            }, 200);
        });
    });
</script>
