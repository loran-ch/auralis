<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>历史记录 - 测试</title>
<link rel="stylesheet" href="../shared/material-symbols.css">
<script src="../shared/auth-client.js?v=2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{background:#faf9fa;font-family:Inter,sans-serif;padding:20px}
.card{margin:12px 0;padding:16px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
.card h3{font-size:18px;font-weight:700;color:#1a1c1d}
.card p{color:#717782;font-size:13px;margin-top:4px}
</style></head><body>
<h1 style="font-size:24px;font-weight:800;margin-bottom:16px">课堂记录</h1>
<p id="status" style="color:#717782">加载中...</p>
<div id="list"></div>
<script>
var TOKEN=localStorage.getItem('livetrans_token')||'';
if(!TOKEN){location.href='login.html'}

fetch('/api/lectures',{headers:{'Authorization':'Bearer '+TOKEN}})
.then(function(r){return r.json()})
.then(function(data){
  var records=data.items||data;
  document.getElementById('status').textContent='共 '+records.length+' 条记录';
  var html='';
  records.forEach(function(l){
    html+='<div class="card" onclick="location.href=\'review.html?id='+l.id+'\'">';
    html+='<h3>'+escapeHtml(l.course_name)+'</h3>';
    html+='<p>'+l.sentence_count+'句 | '+l.source_lang+'→'+l.target_lang+' | '+new Date(l.started_at).toLocaleDateString()+'</p>';
    html+='</div>';
  });
  document.getElementById('list').innerHTML=html;
})
.catch(function(e){
  document.getElementById('status').textContent='加载失败: '+e.message;
});
function escapeHtml(value){var d=document.createElement('div');d.textContent=value==null?'':String(value);return d.innerHTML}
</script>
</body></html>
