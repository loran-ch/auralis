<!DOCTYPE html><html class="light" lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Auralis 智听 - 注册</title>
<link rel="stylesheet" href="../shared/material-symbols.css">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../shared/app-ux.css?v=1">
  <link rel="stylesheet" href="../css/register.css">
  <script src="../shared/tailwind-config.js"></script>
  <script defer src="../js/register.js?v=2"></script>
</head>
<body class="font-body selection:bg-primary/30 min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex items-center px-4 h-16 w-full z-50 sticky top-0 bg-surface/80 backdrop-blur-lg border-b border-surface-container-high">
<button id="registerBack" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-black/5 transition-colors active:scale-95 duration-200 text-on-surface" type="button">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="ml-4 font-headline text-lg tracking-tight font-semibold text-on-surface">Lecture Notes</h1>
</header>
<main class="flex-grow flex items-center justify-center p-6 md:p-12">
<div class="w-full max-w-md space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Header Section -->
<div class="text-center space-y-2">
<h2 class="text-4xl font-extrabold tracking-tight text-on-surface">创建新账户</h2>
<p class="text-on-surface-variant font-medium">开启您的 AI 语音实时翻译之旅</p>
</div>
<!-- Form Section -->
<div class="light-card rounded-xl p-8 space-y-6">
	<!-- Username -->
	<div class="space-y-2">
	<label class="text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1">用户名</label>
	<div class="custom-input flex items-center px-4 py-3.5 rounded-lg group">
	<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors mr-3" data-icon="person">person</span>
	<input id="registerUsername" class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-on-surface-variant/50" placeholder="3-32位字母数字下划线" type="text" autocomplete="username">
	</div>
	</div>
<!-- Set Password -->
<div class="space-y-2">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1">设置密码</label>
<div class="custom-input flex items-center px-4 py-3.5 rounded-lg group">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors mr-3" data-icon="lock">lock</span>
<input id="registerPassword" class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-on-surface-variant/50" placeholder="至少 6 位密码" type="password" autocomplete="new-password">
<button id="toggleRegisterPassword" class="text-on-surface-variant hover:text-primary transition-colors" type="button" aria-label="显示密码" title="显示密码">
<span class="material-symbols-outlined text-sm" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-2">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1">确认密码</label>
<div class="custom-input flex items-center px-4 py-3.5 rounded-lg group">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors mr-3" data-icon="lock">lock</span>
<input id="registerConfirmPassword" class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-on-surface-variant/50" placeholder="请再次输入密码" type="password" autocomplete="new-password">
<button id="toggleConfirmPassword" class="text-on-surface-variant hover:text-primary transition-colors" type="button" aria-label="显示密码" title="显示密码">
<span class="material-symbols-outlined text-sm" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Captcha -->
<div class="space-y-2">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1">验证码</label>
<div class="flex gap-3 items-stretch">
<div class="custom-input flex items-center px-4 py-3.5 rounded-lg group flex-grow">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors mr-3" data-icon="shield_lock">shield_lock</span>
<input id="registerCaptcha" class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-on-surface-variant/50" placeholder="输入右侧字符" type="text" maxlength="4" autocomplete="off">
</div>
<button id="refreshCaptcha" type="button" class="shrink-0 rounded-lg border border-outline-variant/40 bg-white overflow-hidden hover:border-primary/40 transition-colors" title="点击刷新验证码" aria-label="刷新验证码">
<img id="captchaImage" alt="验证码" class="h-[52px] w-[120px] object-contain bg-surface-container-low">
</button>
</div>
<input type="hidden" id="captchaToken" value="">
</div>
<!-- Checkbox -->
<div class="flex items-start space-x-3 pt-2">
<div class="relative flex items-center justify-center mt-1">
<input class="peer h-5 w-5 rounded border-outline bg-surface-container text-primary focus:ring-primary/20 transition-all cursor-pointer" id="terms" type="checkbox">
<span class="material-symbols-outlined absolute text-[12px] text-on-primary opacity-0 peer-checked:opacity-100 pointer-events-none" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<label class="text-sm text-on-surface-variant leading-relaxed cursor-pointer select-none" for="terms">
                    我已阅读并同意 <a class="text-primary font-medium hover:underline transition-all" href="#">用户协议</a> 和 <a class="text-primary font-medium hover:underline transition-all" href="#">隐私政策</a>
</label>
</div>
<!-- Action Button -->
<p id="registerMsg" class="hidden text-center text-sm"></p>
<button id="registerBtn" type="button" class="w-full py-4 rounded-xl bg-primary text-on-primary font-bold text-lg shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 hover:scale-[1.01] active:scale-95 transition-all duration-300 mt-4 relative overflow-hidden group">
<span class="relative z-10">注册并登录</span>
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
</button>
</div>
<!-- Footer Meta -->
<div class="text-center text-on-surface-variant text-sm">
            已有账户？ <a id="registerToLogin" class="text-primary font-semibold hover:underline transition-colors" href="login.html">立即登录</a>
</div>
</div>
</main>
<!-- App Bottom Indicator (Visual only) -->
<div class="h-1.5 w-32 bg-on-surface/10 rounded-full mx-auto mb-2"></div>
<script>
(function () {
  var usernameInput = document.getElementById('registerUsername');
  var passwordInput = document.getElementById('registerPassword');
  var confirmInput = document.getElementById('registerConfirmPassword');
  var captchaInput = document.getElementById('registerCaptcha');
  var captchaTokenInput = document.getElementById('captchaToken');
  var captchaImage = document.getElementById('captchaImage');
  var refreshCaptchaBtn = document.getElementById('refreshCaptcha');
  var registerButton = document.getElementById('registerBtn');
  var message = document.getElementById('registerMsg');
  var nextPage = new URLSearchParams(location.search).get('next') || '';
  if (/^[a-zA-Z0-9._-]+\.html$/.test(nextPage)) {
    var toLogin = document.getElementById('registerToLogin');
    if (toLogin) toLogin.href = 'login.html?next=' + encodeURIComponent(nextPage);
  }
  var registerBack = document.getElementById('registerBack');
  if (registerBack) {
    registerBack.addEventListener('click', function () {
      var loginHref = 'login.html';
      if (/^[a-zA-Z0-9._-]+\.html$/.test(nextPage)) {
        loginHref += '?next=' + encodeURIComponent(nextPage);
      }
      window.location.href = loginHref;
    });
  }

  function showMessage(text, ok) {
    message.textContent = text;
    message.style.color = ok ? '#4CAF50' : '#EF4444';
    message.classList.remove('hidden');
  }

  function postJson(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        if (!response.ok) {
          var detail = data.detail;
          if (Array.isArray(detail)) {
            detail = detail.map(function (item) { return item.msg || JSON.stringify(item); }).join('；');
          }
          throw new Error(detail || '请求失败');
        }
        return data;
      });
    });
  }

  function loadCaptcha() {
    return fetch('/api/auth/captcha')
      .then(function (response) {
        return response.json().catch(function () { return {}; }).then(function (data) {
          if (!response.ok) throw new Error(data.detail || '验证码加载失败');
          return data;
        });
      })
      .then(function (data) {
        captchaTokenInput.value = data.captcha_token || '';
        captchaImage.src = data.image || '';
        captchaInput.value = '';
      })
      .catch(function (error) {
        showMessage(error.message || '验证码加载失败', false);
      });
  }

  refreshCaptchaBtn.addEventListener('click', function () { loadCaptcha(); });

  registerButton.addEventListener('click', function () {
    var username = usernameInput.value.trim();
    var password = passwordInput.value;
    var confirmPassword = confirmInput.value;
    var captchaCode = captchaInput.value.trim();
    var captchaToken = captchaTokenInput.value.trim();

    if (!/^[a-zA-Z0-9_]{3,32}$/.test(username)) return showMessage('用户名需3-32位字母数字下划线', false);
    if (!document.getElementById('terms').checked) return showMessage('请先同意用户协议和隐私政策', false);
    if (password.length < 6) return showMessage('密码至少需要 6 位', false);
    if (password !== confirmPassword) return showMessage('两次输入的密码不一致', false);
    if (!captchaToken) return showMessage('验证码未就绪，请刷新后重试', false);
    if (!/^[a-zA-Z0-9]{4}$/.test(captchaCode)) return showMessage('请输入 4 位验证码', false);

    registerButton.disabled = true;
    registerButton.querySelector('span').textContent = '注册中...';
    postJson('/api/auth/register', {
      username: username,
      password: password,
      confirm_password: confirmPassword,
      captcha_token: captchaToken,
      captcha_code: captchaCode
    })
      .then(function (data) {
        if (!data.tokens || !data.tokens.access_token || !data.user) throw new Error('注册响应格式异常');
        localStorage.setItem('livetrans_token', data.tokens.access_token);
        localStorage.setItem('livetrans_refresh_token', data.tokens.refresh_token || '');
        localStorage.setItem('livetrans_user', JSON.stringify(data.user));
        showMessage('注册成功，正在进入翻译页面', true);
        var next = (new URLSearchParams(location.search).get('next') || 'recorder.html');
        if (!/^[a-zA-Z0-9._-]+\.html$/.test(next)) next = 'recorder.html';
        setTimeout(function () { window.location.href = next; }, 500);
      })
      .catch(function (error) {
        showMessage(error.message, false);
        registerButton.disabled = false;
        registerButton.querySelector('span').textContent = '注册并登录';
        loadCaptcha();
      });
  });

  loadCaptcha();
})();
</script>

</body></html>
