<!DOCTYPE html><html lang="zh-CN"><head>  <link rel="stylesheet" href="../css/knowledge-cards.css">
  <script src="../shared/tailwind-config.js"></script>
  <script defer src="../js/knowledge-cards.js"></script>
</head><body class="bg-background text-on-background font-sans min-h-screen pb-24">

<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<title>LiveTrans Voice - 知识卡片</title>

<!-- Top AppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-4">
<button class="hover:bg-surface-variant/50 transition-colors p-2 rounded-full relative" onclick="document.getElementById('navMenu').classList.toggle('hidden')"><span class="material-symbols-outlined text-primary" data-icon="menu">menu</span></button>
<div id="navMenu" class="hidden fixed top-14 left-4 z-[100] bg-white rounded-2xl shadow-2xl border border-outline-variant/20 py-2 min-w-[180px]">
  <a href="recorder.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low transition-colors text-sm font-medium text-on-surface"><span class="material-symbols-outlined text-primary text-xl">mic</span>实时录音</a>
  <a href="history.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low transition-colors text-sm font-medium text-on-surface"><span class="material-symbols-outlined text-primary text-xl">history</span>课堂记录</a>
  <a href="knowledge-cards.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low transition-colors text-sm font-medium text-on-surface"><span class="material-symbols-outlined text-primary text-xl">star</span>知识卡片</a>
  <a href="profile.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low transition-colors text-sm font-medium text-on-surface"><span class="material-symbols-outlined text-primary text-xl">person</span>个人中心</a>
  <div class="border-t border-outline-variant/10 my-1"></div>
  <a href="login.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low transition-colors text-sm font-medium text-error"><span class="material-symbols-outlined text-xl">logout</span>退出登录</a>
</div>
<h1 class="font-display-current-source text-display-current-source text-primary dark:text-primary-fixed-dim">知识点收藏</h1>
</div>
<a class="hover:bg-surface-variant/50 transition-colors p-2 rounded-full flex items-center justify-center" href="profile.html"><span class="material-symbols-outlined text-on-surface-variant" data-icon="account_circle">account_circle</span></a>
</div>
</header>
<main class="pt-20 px-margin-mobile max-w-screen-xl mx-auto">
<!-- Summary Section -->
<section class="mt-4 mb-stack-lg bg-primary-container/10 p-stack-md rounded-xl border border-primary/10 flex items-center gap-stack-md">
<div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div>
<p class="font-body-history-source text-on-surface font-semibold">本周进度</p>
<p class="font-body-history-trans text-on-surface-variant">你本周已收藏 24 个知识点</p>
</div>
</section>
<!-- Filter Chips -->
<nav class="flex gap-2 overflow-x-auto hide-scrollbar pb-4 -mx-margin-mobile px-margin-mobile mb-4 sticky top-16 bg-background z-40 py-2">
<button class="flex-none px-4 py-1.5 rounded-full bg-primary text-on-primary text-label-tag font-label-tag">全部</button>
<button class="flex-none px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant text-label-tag font-label-tag flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="star" style="font-variation-settings: 'FILL' 1; color: #F97316;">star</span>
                重要
            </button>
<button class="flex-none px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant text-label-tag font-label-tag flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="help" style="font-variation-settings: 'FILL' 1; color: #005ea1;">help</span>
                疑问
            </button>
<button class="flex-none px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant text-label-tag font-label-tag flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="target" style="font-variation-settings: 'FILL' 1; color: #EF4444;">target</span>
                考点
            </button>
<button class="flex-none px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant text-label-tag font-label-tag flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="book" style="font-variation-settings: 'FILL' 1; color: #8B5CF6;">book</span>
                定义
            </button>
</nav>
<!-- Knowledge Cards Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter mt-stack-md" id="cards-grid">
<div class="col-span-full text-center py-12 text-on-surface-variant" id="cards-loading">加载中...</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<footer class="fixed bottom-0 w-full z-50 bg-surface-container-lowest dark:bg-inverse-surface shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] rounded-t-xl">
<div class="fixed bottom-0 w-full flex justify-around items-center h-20 pb-2 px-4">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity active:scale-90 duration-200" href="history.html">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-label-tag text-label-tag">历史</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity active:scale-90 duration-200" href="recorder.html">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center text-white mb-1 shadow-lg shadow-primary/30">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
</div>
<span class="font-label-tag text-label-tag">记录</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="analytics" style="font-variation-settings: 'FILL' 1;">analytics</span>
<span class="font-label-tag text-label-tag">复习</span>
</a>
</div>
</footer>
<!-- Micro-interaction Script -->

<script>
(function(){
  var TOKEN=localStorage.getItem('livetrans_token');
  var tagNames={important:'⭐重要',question:'❓疑问',exam:'🎯考点',definition:'📖定义'};
  var tagColors={important:'bg-orange-500',question:'bg-primary',exam:'bg-alert-red',definition:'bg-accent-purple'};

  function loadCards(){
    fetch('/api/bookmarks',{headers:{'Authorization':'Bearer '+TOKEN}})
    .then(function(r){return r.json()})
    .then(function(list){
      var grid=document.getElementById('cards-grid');
      if(!grid)return;
      grid.innerHTML='';
      if(!list||!list.length){grid.innerHTML='<div class="col-span-full text-center py-12 text-on-surface-variant">还没有收藏，去<a class="text-primary font-bold" href="recorder.html">录音</a>吧</div>';return}
      list.forEach(function(b){
        var d=document.createElement('div');
        d.className='knowledge-card bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-stack-md flex flex-col gap-stack-sm shadow-sm';
        d.innerHTML=
          '<div class="flex justify-between items-start mb-1"><span class="'+(tagColors[b.tag]||'bg-primary')+' text-white px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">'+(tagNames[b.tag]||b.tag)+'</span><span class="font-caption-timestamp text-ink-subdued">'+(b.created_at?new Date(b.created_at).toLocaleString('zh-CN'):'')+'</span></div>'+
          '<div class="flex flex-col gap-2"><p class="text-ink-deep leading-relaxed">'+(b.source_text||'')+'</p><p class="text-secondary leading-relaxed italic">'+(b.translated_text||'')+'</p></div>'+
          '<div class="mt-4 pt-4 border-t border-outline-variant/20 flex gap-2"><a class="flex-1 py-2 rounded-lg bg-surface-container text-primary font-label-tag hover:bg-primary/5 transition-colors flex items-center justify-center gap-2" href="recorder.html"><span class="material-symbols-outlined text-[18px]">play_circle</span>去听录音</a></div>';
        grid.appendChild(d);
      })
    })
    .catch(function(){document.getElementById('cards-grid').innerHTML='<div class="col-span-full text-center py-12 text-error">加载失败</div>'})
  }

  if(TOKEN){loadCards()}
  }
})();
</script>
</body></html>
