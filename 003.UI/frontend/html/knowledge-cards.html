<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>LiveTrans Voice - 知识卡片</title>
<link rel="stylesheet" href="../shared/material-symbols.css">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/knowledge-cards.css">
<link rel="stylesheet" href="../shared/app-ux.css?v=1">
<link rel="stylesheet" href="../shared/app-navigation.css?v=1">
<script src="../shared/tailwind-config.js"></script>
<script src="../shared/auth-client.js?v=2"></script>
<script defer src="../shared/app-navigation.js?v=1"></script>
</head><body class="bg-background text-on-background font-sans min-h-screen pb-24">

<!-- Top AppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-4">
<button type="button" data-nav-toggle aria-controls="navMenu" aria-expanded="false" class="hover:bg-surface-variant/50 transition-colors p-2 rounded-full relative"><span class="material-symbols-outlined text-primary" data-icon="menu">menu</span></button>
<nav id="navMenu" class="app-nav-menu hidden" aria-label="主导航">
  <a href="recorder.html" data-nav-page><span class="material-symbols-outlined">mic</span>实时录音</a>
  <a href="history.html" data-nav-page><span class="material-symbols-outlined">history</span>课堂记录</a>
  <a href="courses.html" data-nav-page><span class="material-symbols-outlined">school</span>课程中心</a>
  <a href="assistant.html" data-nav-page><span class="material-symbols-outlined">psychology</span>学习助手</a>
  <a href="knowledge-cards.html" data-nav-page><span class="material-symbols-outlined">star</span>知识卡片</a>
  <a href="profile.html" data-nav-page><span class="material-symbols-outlined">person</span>个人中心</a>
  <div class="app-nav-divider"></div>
  <a href="login.html?next=knowledge-cards.html" data-nav-auth class="app-nav-auth is-login"><span class="material-symbols-outlined">login</span>登录 / 注册</a>
</nav>
<h1 class="font-display-current-source text-display-current-source text-primary dark:text-primary-fixed-dim">知识点收藏</h1>
</div>
<a class="hover:bg-surface-variant/50 transition-colors p-2 rounded-full flex items-center justify-center" href="profile.html"><span class="material-symbols-outlined text-on-surface-variant" data-icon="account_circle">account_circle</span></a>
</div>
</header>
<main class="pt-20 px-margin-mobile max-w-screen-xl mx-auto">
<!-- Summary Section -->
<section class="mt-4 mb-stack-lg bg-primary-container/10 p-stack-md rounded-xl border border-primary/10 flex items-center gap-stack-md">
<div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div>
<p class="font-body-history-source text-on-surface font-semibold">本周进度</p>
<p class="font-body-history-trans text-on-surface-variant">你本周已收藏 <span id="summary-count">0</span> 个知识点</p>
</div>
</section>
<!-- Filter Chips -->
<nav class="flex gap-2 overflow-x-auto hide-scrollbar pb-4 -mx-margin-mobile px-margin-mobile mb-4 sticky top-16 bg-background z-40 py-2">
<button class="flex-none px-4 py-1.5 rounded-full bg-primary text-on-primary text-label-tag font-label-tag filter-chip active" data-filter="all">全部</button>
<button class="flex-none px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant text-label-tag font-label-tag flex items-center gap-1 filter-chip" data-filter="important">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1; color: #F97316;">star</span>重要</button>
<button class="flex-none px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant text-label-tag font-label-tag flex items-center gap-1 filter-chip" data-filter="question">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1; color: #005ea1;">help</span>疑问</button>
<button class="flex-none px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant text-label-tag font-label-tag flex items-center gap-1 filter-chip" data-filter="exam">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1; color: #EF4444;">target</span>考点</button>
<button class="flex-none px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant text-label-tag font-label-tag flex items-center gap-1 filter-chip" data-filter="definition">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1; color: #8B5CF6;">book</span>定义</button>
</nav>
<!-- Knowledge Cards Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter mt-stack-md" id="cards-grid">
<div class="col-span-full text-center py-12 text-on-surface-variant" id="cards-loading">加载中...</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<footer class="fixed bottom-0 w-full z-50 bg-surface-container-lowest dark:bg-inverse-surface shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] rounded-t-xl">
<div class="fixed bottom-0 w-full flex justify-around items-center h-20 pb-2 px-4">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity active:scale-90 duration-200" href="history.html">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-label-tag text-label-tag">历史</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity active:scale-90 duration-200" href="recorder.html">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center text-white mb-1 shadow-lg shadow-primary/30">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
</div>
<span class="font-label-tag text-label-tag">记录</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 transition-transform duration-200" href="profile.html">
<span class="material-symbols-outlined mb-1" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-tag text-label-tag">主页</span>
</a>
</div>
</footer>

<script>
// ─── 知识卡片 — 内联脚本（无外部依赖）──────────────
(function () {
  var TOKEN = localStorage.getItem('livetrans_token');
  var grid = document.getElementById('cards-grid');
  var summaryCount = document.getElementById('summary-count');

  var tagNames = { important: '⭐重要', question: '❓疑问', exam: '🎯考点', definition: '📖定义' };
  var tagColors = { important: 'bg-orange-500', question: 'bg-primary', exam: 'bg-alert-red', definition: 'bg-accent-purple' };

  var allBookmarks = [];
  var currentFilter = 'all';

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str || ''));
    return div.innerHTML;
  }

  function show(msg) {
    if (!grid) return;
    grid.innerHTML = '<div class="col-span-full text-center py-12 text-on-surface-variant">' + msg + '</div>';
  }

  function renderCards(list) {
    if (!grid) return;
    grid.innerHTML = '';

    if (!list || !Array.isArray(list) || !list.length) {
      var label = currentFilter === 'all' ? '' : (tagNames[currentFilter] || currentFilter) + ' ';
      show('还没有' + label + '收藏，去<a class="text-primary font-bold" href="recorder.html">录音</a>吧');
      if (summaryCount) summaryCount.textContent = '0';
      return;
    }

    if (summaryCount) summaryCount.textContent = String(list.length);

    list.forEach(function (b) {
      var card = document.createElement('div');
      card.className = 'knowledge-card bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-stack-md flex flex-col gap-stack-sm shadow-sm hover:shadow-md transition-all duration-200';
      card.style.cssText = 'hover:shadow-md;';
      card.innerHTML =
        '<div class="flex justify-between items-start mb-1">' +
          '<span class="' + (tagColors[b.tag] || 'bg-primary') + ' text-white px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">' + escapeHtml(tagNames[b.tag] || b.tag || '') + '</span>' +
          '<span class="font-caption-timestamp text-ink-subdued">' + (b.created_at ? new Date(b.created_at).toLocaleString('zh-CN') : '') + '</span>' +
        '</div>' +
        '<div class="flex flex-col gap-2">' +
          '<p class="text-ink-deep leading-relaxed">' + escapeHtml(b.source_text || '') + '</p>' +
          '<p class="text-secondary leading-relaxed italic">' + escapeHtml(b.translated_text || '') + '</p>' +
        '</div>' +
        '<div class="mt-4 pt-4 border-t border-outline-variant/20 flex gap-2">' +
          '<span class="flex-1 py-2 rounded-lg text-center bg-surface-container text-on-surface-variant font-label-tag">' + escapeHtml(b.course_name || '') + '</span>' +
        '</div>';
      grid.appendChild(card);
    });
  }

  // ─── 筛选逻辑 ─────────────────────────────────
  function filterAndRender(tag) {
    currentFilter = tag;
    var filtered = tag === 'all' ? allBookmarks : allBookmarks.filter(function (b) { return b.tag === tag; });
    renderCards(filtered);
  }

  function setActiveChip(activeBtn) {
    var chips = document.querySelectorAll('.filter-chip');
    chips.forEach(function (chip) {
      chip.classList.remove('bg-primary', 'text-on-primary');
      chip.classList.add('bg-surface-container-high', 'text-on-surface-variant');
    });
    if (activeBtn) {
      activeBtn.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
      activeBtn.classList.add('bg-primary', 'text-on-primary');
    }
  }

  // ─── 绑定筛选按钮 ─────────────────────────────
  var chips = document.querySelectorAll('.filter-chip');
  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      var tag = this.getAttribute('data-filter');
      if (!tag) return;
      setActiveChip(this);
      filterAndRender(tag);
    });
  });

  // ─── 主流程 ───────────────────────────────────
  if (!grid) return;

  if (!TOKEN) {
    show('请先<a class="text-primary font-bold" href="login.html">登录</a>');
    return;
  }

  fetch('/api/bookmarks', {
    headers: { 'Authorization': 'Bearer ' + TOKEN }
  })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (list) {
      allBookmarks = Array.isArray(list) ? list : [];
      filterAndRender('all');
      return fetch('/api/auth/stats', {
        headers: { 'Authorization': 'Bearer ' + TOKEN }
      });
    })
    .then(function (response) {
      if (!response || !response.ok) return null;
      return response.json();
    })
    .then(function (stats) {
      if (stats && summaryCount) {
        summaryCount.textContent = String(stats.weekly_bookmark_count || 0);
      }
    })
    .catch(function (err) {
      console.error('知识卡片加载失败:', err);
      show('加载失败（' + escapeHtml(err.message) + '），请确认已<a class="text-primary font-bold underline" href="login.html">登录</a>');
    });
})();
</script>
</body></html>
