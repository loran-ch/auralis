<!DOCTYPE html><html class="light" lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>LiveTrans Voice - 个人中心</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/profile.css">
<script src="../shared/tailwind-config.js"></script>
<script src="../shared/auth-client.js?v=2"></script>
</head>
<body class="min-h-screen pb-24 bg-surface">

<!-- Top App Bar -->
<header class="bg-surface/80 backdrop-blur-md border-b border-outline-variant/30 sticky top-0 flex items-center px-4 h-16 w-full z-50">
  <a href="recorder.html" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-black/5 transition-colors active:scale-95 duration-200 text-on-surface">
    <span class="material-symbols-outlined">arrow_back</span>
  </a>
  <h1 class="ml-2 font-headline text-lg tracking-tight font-semibold text-on-surface">个人中心</h1>
  <div class="flex-grow"></div>
  <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-black/5 transition-colors active:scale-95 duration-200 text-on-surface-variant" id="logoutMenuBtn">
    <span class="material-symbols-outlined">more_vert</span>
  </button>
  <div id="logoutBtn" class="hidden absolute top-14 right-4 bg-white rounded-xl shadow-xl border border-outline-variant/20 py-2 min-w-[120px] z-50">
    <button id="doLogout" class="w-full flex items-center gap-2 px-4 py-3 text-error text-sm font-medium hover:bg-surface-container-low transition-colors">
      <span class="material-symbols-outlined text-lg">logout</span>退出登录
    </button>
  </div>
</header>

<main class="max-w-2xl mx-auto px-6 pt-8 space-y-8">

  <!-- Profile Section -->
  <section class="flex flex-col items-center">
    <!-- Avatar - click to upload -->
    <div class="relative group cursor-pointer" id="avatar-wrapper" title="点击更换头像">
      <div class="w-28 h-28 rounded-full p-1 bg-gradient-to-tr from-primary/20 to-secondary/20 transition-transform duration-500 group-hover:scale-105">
        <div class="w-full h-full rounded-full overflow-hidden border-2 border-surface bg-surface-variant">
          <img id="avatar-img" class="w-full h-full object-cover" src="" alt="头像" onerror="this.style.display='none';document.getElementById('avatar-placeholder').style.display='flex'">
          <div id="avatar-placeholder" class="w-full h-full flex items-center justify-center" style="display:none">
            <span class="material-symbols-outlined text-5xl text-on-surface-variant">person</span>
          </div>
        </div>
      </div>
      <!-- Upload overlay -->
      <div class="absolute inset-0 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
        <div class="w-8 h-8 rounded-full bg-black/50 flex items-center justify-center">
          <span class="material-symbols-outlined text-white text-sm">photo_camera</span>
        </div>
      </div>
      <!-- Status Badge -->
      <div class="absolute bottom-1 right-1 w-6 h-6 bg-green-500 border-4 border-surface rounded-full"></div>
    </div>
    <input type="file" id="avatar-input" accept="image/*" style="display:none">

    <!-- Name - click to edit -->
    <div class="mt-4 text-center">
      <div class="flex items-center justify-center gap-2">
        <h2 class="text-2xl font-bold text-on-surface tracking-tight cursor-pointer hover:text-primary transition-colors group" id="name-display" title="点击修改昵称">
          <span id="name-text">加载中...</span>
          <span class="material-symbols-outlined text-sm text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity ml-1">edit</span>
        </h2>
      </div>
      <div id="name-edit" style="display:none" class="flex items-center justify-center gap-2 mt-1">
        <input id="name-input" class="w-40 px-3 py-1.5 border border-primary rounded-lg text-center text-on-surface text-lg font-bold focus:ring-2 focus:ring-primary/20 outline-none" maxlength="64">
        <button id="name-save" class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center hover:opacity-90 transition-opacity">
          <span class="material-symbols-outlined text-sm">check</span>
        </button>
        <button id="name-cancel" class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center hover:bg-surface-container-high transition-colors">
          <span class="material-symbols-outlined text-sm">close</span>
        </button>
      </div>
      <p class="text-on-surface-variant text-sm mt-1" id="user-subtitle"></p>
    </div>
  </section>

  <!-- Stats Section -->
  <section class="grid grid-cols-2 gap-4">
    <div class="bg-surface-container card-shadow p-5 rounded-2xl flex flex-col items-center justify-center text-center space-y-1 group hover:bg-primary-container/30 transition-all duration-300">
      <span class="material-symbols-outlined text-primary mb-1 group-hover:scale-110 transition-transform">schedule</span>
      <span class="text-2xl font-bold text-on-surface" id="stat-hours">--</span>
      <span class="text-xs text-on-surface-variant font-medium">总录制时长</span>
    </div>
    <div class="bg-surface-container card-shadow p-5 rounded-2xl flex flex-col items-center justify-center text-center space-y-1 group hover:bg-primary-container/30 transition-all duration-300">
      <span class="material-symbols-outlined text-primary mb-1 group-hover:scale-110 transition-transform">bookmark_manager</span>
      <span class="text-2xl font-bold text-on-surface" id="stat-bookmarks">--</span>
      <span class="text-xs text-on-surface-variant font-medium">收藏知识点</span>
    </div>
    <div class="bg-surface-container card-shadow p-5 rounded-2xl flex flex-col items-center justify-center text-center space-y-1 group hover:bg-primary-container/30 transition-all duration-300">
      <span class="material-symbols-outlined text-primary mb-1 group-hover:scale-110 transition-transform">mic</span>
      <span class="text-2xl font-bold text-on-surface" id="stat-lectures">--</span>
      <span class="text-xs text-on-surface-variant font-medium">录制课堂</span>
    </div>
    <div class="bg-surface-container card-shadow p-5 rounded-2xl flex flex-col items-center justify-center text-center space-y-1 group hover:bg-primary-container/30 transition-all duration-300">
      <span class="material-symbols-outlined text-primary mb-1 group-hover:scale-110 transition-transform">star</span>
      <span class="text-2xl font-bold text-on-surface" id="stat-streak">--</span>
      <span class="text-xs text-on-surface-variant font-medium">本周收藏</span>
    </div>
  </section>

  <!-- CTA Button -->
  <a href="recorder.html" class="w-full h-16 rounded-2xl bg-primary hover:bg-primary/90 flex items-center justify-center gap-3 transition-all active:scale-[0.98] shadow-lg shadow-primary/20">
    <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white">
      <span class="material-symbols-outlined font-bold">mic</span>
    </div>
    <span class="text-lg font-semibold text-white">开始记录</span>
  </a>

  <!-- Functional Menu -->
  <div class="bg-surface-container card-shadow rounded-2xl overflow-hidden divide-y divide-outline-variant/30">
    <a class="flex items-center justify-between p-5 hover:bg-surface-variant/50 transition-colors group" href="history.html">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-xl bg-surface-variant flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">
          <span class="material-symbols-outlined">history</span>
        </div>
        <span class="font-medium text-on-surface">课堂记录</span>
      </div>
      <span class="material-symbols-outlined text-outline">chevron_right</span>
    </a>
    <a class="flex items-center justify-between p-5 hover:bg-surface-variant/50 transition-colors group" href="knowledge-cards.html">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-xl bg-surface-variant flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">
          <span class="material-symbols-outlined">star</span>
        </div>
        <span class="font-medium text-on-surface">知识卡片</span>
      </div>
      <span class="material-symbols-outlined text-outline">chevron_right</span>
    </a>
    <a class="flex items-center justify-between p-5 hover:bg-surface-variant/50 transition-colors group" href="recorder.html">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-xl bg-surface-variant flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">
          <span class="material-symbols-outlined">mic</span>
        </div>
        <span class="font-medium text-on-surface">开始录音</span>
      </div>
      <span class="material-symbols-outlined text-outline">chevron_right</span>
    </a>
  </div>

  <!-- Profile & Preferences -->
  <section class="bg-surface-container card-shadow rounded-2xl p-5 space-y-4">
    <div class="flex items-center justify-between">
      <h3 class="font-bold text-on-surface">个人资料与翻译偏好</h3>
      <span class="material-symbols-outlined text-primary">settings</span>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <input id="profile-university" class="rounded-xl border-outline-variant bg-white" placeholder="学校">
      <input id="profile-major" class="rounded-xl border-outline-variant bg-white" placeholder="专业">
      <input id="profile-focus" class="rounded-xl border-outline-variant bg-white" placeholder="专注领域">
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <label class="text-xs text-on-surface-variant">识别语言
        <select id="setting-source-lang" class="mt-1 w-full rounded-xl border-outline-variant bg-white"></select>
      </label>
      <label class="text-xs text-on-surface-variant">翻译语言
        <select id="setting-target-lang" class="mt-1 w-full rounded-xl border-outline-variant bg-white"></select>
      </label>
      <label class="text-xs text-on-surface-variant">界面主题
        <select id="setting-dark-mode" class="mt-1 w-full rounded-xl border-outline-variant bg-white">
          <option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option>
        </select>
      </label>
    </div>
    <label class="flex items-center gap-2 text-sm text-on-surface-variant">
      <input id="setting-cloud-sync" type="checkbox" class="rounded text-primary">启用云端同步
    </label>
    <button id="save-preferences" class="w-full py-3 rounded-xl bg-primary text-white font-semibold">保存资料与偏好</button>
  </section>

  <!-- Course Schedule -->
  <section class="bg-surface-container card-shadow rounded-2xl p-5 space-y-4">
    <div class="flex items-center justify-between">
      <h3 class="font-bold text-on-surface">我的课程表</h3>
      <span class="material-symbols-outlined text-primary">calendar_month</span>
    </div>
    <div id="schedule-list" class="space-y-2 text-sm text-on-surface-variant">加载中...</div>
    <div class="grid grid-cols-2 md:grid-cols-5 gap-2">
      <input id="schedule-name" class="col-span-2 rounded-xl border-outline-variant bg-white" placeholder="课程名称">
      <select id="schedule-day" class="rounded-xl border-outline-variant bg-white">
        <option value="1">周一</option><option value="2">周二</option><option value="3">周三</option>
        <option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option>
      </select>
      <input id="schedule-start" type="time" value="09:00" class="rounded-xl border-outline-variant bg-white">
      <input id="schedule-end" type="time" value="10:00" class="rounded-xl border-outline-variant bg-white">
    </div>
    <div class="grid grid-cols-2 gap-2">
      <input id="schedule-room" class="rounded-xl border-outline-variant bg-white" placeholder="教室（可选）">
      <input id="schedule-professor" class="rounded-xl border-outline-variant bg-white" placeholder="教师（可选）">
    </div>
    <button id="add-schedule" class="w-full py-3 rounded-xl border border-primary text-primary font-semibold hover:bg-primary/5">添加课程</button>
  </section>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-[100] bg-gray-900 text-white px-4 py-2 rounded-full text-sm shadow-lg"></div>

</main>

<!-- Bottom Navigation Bar -->
<nav class="bg-surface/90 backdrop-blur-xl border-t border-outline-variant/30 fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-6 pb-safe">
  <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-300" href="history.html">
    <span class="material-symbols-outlined">history</span>
    <span class="font-label text-[10px] font-medium mt-1">历史</span>
  </a>
  <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-300" href="recorder.html">
    <span class="material-symbols-outlined">mic</span>
    <span class="font-label text-[10px] font-medium mt-1">录音</span>
  </a>
  <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-300" href="knowledge-cards.html">
    <span class="material-symbols-outlined">star</span>
    <span class="font-label text-[10px] font-medium mt-1">卡片</span>
  </a>
  <a class="flex flex-col items-center justify-center text-primary transition-all active:scale-90 duration-300" href="profile.html">
    <span class="material-symbols-outlined active-icon" style="font-variation-settings: 'FILL' 1;">person</span>
    <span class="font-label text-[10px] font-medium mt-1">我的</span>
  </a>
</nav>

<script src="../js/profile.js?v=2"></script>
</body></html>
