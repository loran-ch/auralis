<!DOCTYPE html><html class="light" lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>LiveTrans Voice - 已完成课堂回顾</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/review.css">

  <script defer src="../js/review.js"></script>
<script>
// ─── 自动登录 + 加载课堂回顾 ──────────────────────
(function(){
  var LID = new URLSearchParams(window.location.search).get('id') || 1;
  var TOKEN = localStorage.getItem('livetrans_token');

  function api(path) {
    return fetch('/api' + path, { headers: { 'Authorization': 'Bearer ' + TOKEN } }).then(function(r) { return r.json(); });
  }

  function render() {
    Promise.all([api('/lectures/' + LID + '/transcriptions'), api('/lectures/active')])
    .then(function(results) {
      var transcriptions = results[0];
      var container = document.getElementById('transcript-container');
      if (!container || !transcriptions.length) return;
      container.innerHTML = '';
      transcriptions.forEach(function(t) {
        var cls = t.is_bookmarked ? 'bg-orange-50/50 p-4 -mx-4 border-l-4 border-tertiary-container' : 'p-2 -mx-2';
        var tagHtml = t.is_bookmarked ? '<span class="knowledge-tag flex items-center gap-1 bg-tertiary-container text-on-tertiary-container px-2 py-0.5 rounded font-label-tag text-[10px] uppercase"><span class="material-symbols-outlined text-[12px]" style="font-variation-settings:\'FILL\' 1;">star</span> 重要</span>' : '';
        var div = document.createElement('div');
        div.className = 'cursor-pointer group relative hover:bg-surface-container-low ' + cls + ' rounded-lg transition-colors';
        div.innerHTML =
          '<div class="flex flex-col gap-2">' + tagHtml +
            '<p class="text-body-history-source text-ink-deep">' + t.source_text + '</p>' +
            '<p class="text-body-history-trans text-secondary">' + t.translated_text + '</p>' +
          '</div>';
        container.appendChild(div);
      });
      // Update header
      var titleEl = document.querySelector('h2');
      if (titleEl) titleEl.textContent = '课堂回顾 #' + LID;
    });
  }

  if (TOKEN) { render(); }
  else {
    fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({phone:'+8613800000001',password:'test123'}) })
    .then(function(r){return r.json()}).then(function(d){localStorage.setItem('livetrans_token',d.tokens.access_token);location.reload()});
  }
})();
</script>
</head>

</div>

</button>
