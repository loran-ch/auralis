<script>
// ─── 课堂回顾 — 加载 + 收藏 ──────────────────────
(function(){
  var LID = new URLSearchParams(window.location.search).get('id') || 1;
  var TOKEN = localStorage.getItem('livetrans_token');
  var tagPicker = document.getElementById('tagPicker');
  var toastEl = document.getElementById('toast');
  var tagPickerCallback = null;
  var transcriptionsData = [];  // 存储转录数据用于导出
  var currentBriefing = null;
  var lectureStatus = '';
  var briefingTimer = null;
  var briefingPolls = 0;
  var chatHistory = [];
  var asking = false;

  var tagNames = { important: '⭐重要', question: '❓疑问', exam: '🎯考点', definition: '📖定义' };
  var tagColors = {
    important: 'bg-orange-500',
    question: 'bg-primary',
    exam: 'bg-alert-red',
    definition: 'bg-accent-purple'
  };

  function api(path, opts) {
    opts = opts || {};
    var headers = { 'Authorization': 'Bearer ' + TOKEN };
    if (opts.body) headers['Content-Type'] = 'application/json';
    return fetch('/api' + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body || undefined
    }).then(function(r) {
      return r.json().then(function(d) { if (!r.ok) throw new Error(d.detail || 'fail'); return d; });
    });
  }

  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.remove('hidden');
    setTimeout(function () { toastEl.classList.add('hidden'); }, 2500);
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str || ''));
    return div.innerHTML;
  }

  function formatDuration(totalSeconds) {
    totalSeconds = Number(totalSeconds || 0);
    var hours = Math.floor(totalSeconds / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    if (hours) return hours + '小时' + minutes + '分钟';
    return minutes + '分钟';
  }

  function offsetForOrder(order) {
    var item = transcriptionsData.find(function (t) { return Number(t.sentence_order) === Number(order); });
    return item && item.start_offset_ms != null ? item.start_offset_ms : 0;
  }

  function jumpToSentence(order, startMs) {
    var el = document.getElementById('sentence-' + order);
    if (el) {
      document.querySelectorAll('.sentence-jump-active').forEach(function (node) {
        node.classList.remove('sentence-jump-active');
      });
      el.classList.add('sentence-jump-active');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    var audio = document.getElementById('lecture-audio');
    var ms = startMs == null || startMs === '' ? offsetForOrder(order) : Number(startMs);
    if (audio && audio.src && !isNaN(ms) && ms >= 0) {
      audio.currentTime = ms / 1000;
    }
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-jump]');
    if (!btn) return;
    var order = parseInt(btn.getAttribute('data-jump'), 10);
    if (!order) return;
    jumpToSentence(order, btn.getAttribute('data-start-ms'));
  });

  function jumpButton(order, startMs, label) {
    return '<button type="button" class="text-primary font-semibold hover:underline" data-jump="' +
      order + '" data-start-ms="' + (startMs || 0) + '">' + escapeHtml(label || ('#' + order)) + '</button>';
  }

  function linkifyHashes(text) {
    return escapeHtml(text || '').replace(/#(\d+)/g, function (_, order) {
      return jumpButton(order, offsetForOrder(order), '#' + order);
    }).replace(/\n/g, '<br>');
  }

  function citationList(items) {
    if (!items || !items.length) return '';
    return '<div class="mt-2 flex flex-col gap-1">' + items.map(function (item) {
      var order = item.sentence_order || item.start_order;
      var text = item.text || item.translated_text || item.summary || item.title || item.term || '';
      return '<button type="button" class="text-left text-xs text-on-surface-variant hover:text-primary border border-outline-variant/20 rounded-lg px-3 py-2" data-jump="' +
        order + '" data-start-ms="' + (item.start_offset_ms || 0) + '">#' + order + ' ' + escapeHtml(text) + '</button>';
    }).join('') + '</div>';
  }

  function setBriefingStatus(text) {
    var el = document.getElementById('briefing-status');
    if (el) el.textContent = text;
  }

  function stopBriefingPoll() {
    if (briefingTimer) {
      clearInterval(briefingTimer);
      briefingTimer = null;
    }
    briefingPolls = 0;
  }

  function renderBriefing(data) {
    currentBriefing = data;
    var body = document.getElementById('briefing-body');
    var refreshBtn = document.getElementById('briefing-refresh');
    if (!body) return data;
    var status = data && data.status;
    if (refreshBtn) {
      refreshBtn.classList.toggle('hidden', !(status === 'ready' || status === 'failed' || status === 'empty'));
    }
    if (status === 'generating' || status === 'missing') {
      setBriefingStatus(status === 'generating' ? '正在生成课堂简报…' : '尚未生成，正在启动…');
      body.innerHTML = '<div class="animate-pulse h-16 bg-surface-container-low rounded-xl"></div>';
      return data;
    }
    if (status === 'empty') {
      setBriefingStatus('没有转录内容');
      body.innerHTML = '<p class="text-on-surface-variant">这堂课还没有转录，无法生成简报。</p>';
      return data;
    }
    if (status === 'failed') {
      setBriefingStatus('生成失败');
      body.innerHTML = '<p class="text-error">' + escapeHtml(data.error_message || '简报生成失败') + '</p>';
      return data;
    }
    if (status !== 'ready') {
      setBriefingStatus('暂无简报');
      body.innerHTML = '<p class="text-on-surface-variant">打开已完成的课堂后会自动生成简报。</p>';
      return data;
    }
    var providerHint = data.provider && data.provider.indexOf('llm:') === 0 ? '大模型润色' : '根据字幕抽取';
    setBriefingStatus(providerHint + (data.error_message ? ' · ' + data.error_message : ''));
    var html = '';
    if (data.overview) {
      html += '<p class="text-ink-deep leading-relaxed mb-3">' + linkifyHashes(data.overview) + '</p>';
    }
    if (data.outline && data.outline.length) {
      html += '<p class="text-xs font-bold text-on-surface-variant mb-1">大纲</p><ul class="space-y-1 mb-3">';
      data.outline.forEach(function (item) {
        html += '<li>' + jumpButton(item.start_order, item.start_offset_ms, '#' + item.start_order + ' ' + (item.title || '')) +
          (item.summary && item.summary !== item.title ? '<span class="text-ink-subdued"> · ' + escapeHtml(item.summary) + '</span>' : '') + '</li>';
      });
      html += '</ul>';
    }
    function block(title, items, mapItem) {
      if (!items || !items.length) return;
      html += '<p class="text-xs font-bold text-on-surface-variant mb-1">' + title + '</p>';
      html += citationList(mapItem ? items.map(mapItem) : items);
    }
    block('要点', data.key_points);
    block('考点', data.exam_hints);
    block('疑问', data.questions);
    block('术语', data.terms, function (item) {
      return {
        sentence_order: item.sentence_order,
        start_offset_ms: item.start_offset_ms,
        text: (item.term || '') + (item.explanation ? '：' + item.explanation : '')
      };
    });
    body.innerHTML = html || '<p class="text-on-surface-variant">简报已生成，但没有可展示的要点。</p>';
    return data;
  }

  function pollBriefing() {
    stopBriefingPoll();
    briefingTimer = setInterval(function () {
      briefingPolls += 1;
      if (briefingPolls > 30) {
        stopBriefingPoll();
        setBriefingStatus('生成超时，可点击重新生成');
        var refreshBtn = document.getElementById('briefing-refresh');
        if (refreshBtn) refreshBtn.classList.remove('hidden');
        return;
      }
      api('/lectures/' + LID + '/briefing').then(function (data) {
        renderBriefing(data);
        if (data.status !== 'generating' && data.status !== 'missing') stopBriefingPoll();
      }).catch(function () {});
    }, 2000);
  }

  function requestBriefing(force) {
    setBriefingStatus(force ? '正在重新生成…' : '正在生成课堂简报…');
    return api('/lectures/' + LID + '/briefing', {
      method: 'POST',
      body: JSON.stringify({ force: !!force })
    }).then(function (data) {
      renderBriefing(data);
      if (data.status === 'generating' || data.status === 'missing') pollBriefing();
      return data;
    }).catch(function (err) {
      setBriefingStatus('简报加载失败');
      var body = document.getElementById('briefing-body');
      if (body) body.innerHTML = '<p class="text-error">' + escapeHtml(err.message || '失败') + '</p>';
    });
  }

  function loadBriefing() {
    return api('/lectures/' + LID + '/briefing').then(function (data) {
      renderBriefing(data);
      if (data.status === 'missing' && lectureStatus === 'completed') {
        return requestBriefing(false);
      }
      if (data.status === 'generating') pollBriefing();
      return data;
    }).catch(function (err) {
      setBriefingStatus('简报加载失败');
      var body = document.getElementById('briefing-body');
      if (body) body.innerHTML = '<p class="text-error">' + escapeHtml(err.message || '失败') + '</p>';
    });
  }

  function appendChat(role, text, citations) {
    var log = document.getElementById('assistant-log');
    if (!log) return;
    var wrap = document.createElement('div');
    wrap.className = role === 'user' ? 'text-right' : 'text-left';
    var bubble = document.createElement('div');
    bubble.className = (role === 'user'
      ? 'inline-block max-w-[90%] rounded-2xl px-3 py-2 bg-primary text-white'
      : 'inline-block max-w-[90%] rounded-2xl px-3 py-2 bg-surface-container-low text-ink-deep') + ' leading-relaxed';
    if (role === 'user') bubble.textContent = text;
    else bubble.innerHTML = linkifyHashes(text) + citationList(citations || []);
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  function setAsking(on) {
    asking = on;
    var send = document.getElementById('assistant-send');
    var input = document.getElementById('assistant-input');
    if (send) send.disabled = on;
    if (input) input.disabled = on;
  }

  function askAssistant(question) {
    question = (question || '').trim();
    if (!question || asking) return;
    appendChat('user', question);
    chatHistory.push({ role: 'user', content: question });
    setAsking(true);
    api('/lectures/' + LID + '/assistant/ask', {
      method: 'POST',
      body: JSON.stringify({ question: question, history: chatHistory.slice(-6, -1) })
    }).then(function (data) {
      appendChat('assistant', data.answer || '', data.citations || []);
      chatHistory.push({ role: 'assistant', content: data.answer || '' });
      var hint = document.getElementById('assistant-hint');
      if (hint && data.provider === 'extractive') {
        hint.textContent = '当前为检索回答。点击 #编号 可跳到原句并定位录音。';
      }
    }).catch(function (err) {
      appendChat('assistant', err.message || '提问失败');
    }).then(function () { setAsking(false); });
  }

  var briefingRefresh = document.getElementById('briefing-refresh');
  if (briefingRefresh) {
    briefingRefresh.addEventListener('click', function () { requestBriefing(true); });
  }
  document.querySelectorAll('.js-preset-q').forEach(function (btn) {
    btn.addEventListener('click', function () { askAssistant(btn.getAttribute('data-q')); });
  });
  var assistantForm = document.getElementById('assistant-form');
  if (assistantForm) {
    assistantForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var input = document.getElementById('assistant-input');
      var text = input ? input.value : '';
      if (input) input.value = '';
      askAssistant(text);
    });
  }

  function loadLectureInfo() {
    return api('/lectures/' + LID).then(function (lecture) {
      lectureStatus = lecture.status || '';
      var title = lecture.course_name || '课堂回顾';
      var dateText = lecture.lecture_date
        ? new Date(lecture.lecture_date + 'T00:00:00').toLocaleDateString('zh-CN') : '';
      document.getElementById('review-title').textContent = title;
      document.getElementById('review-subtitle').textContent = title + (dateText ? ' • ' + dateText : '');
      var location = [lecture.location_name, lecture.room].filter(Boolean).join(' · ');
      document.getElementById('review-meta').textContent =
        (location ? '录制于' + location + ' • ' : '') + formatDuration(lecture.duration_seconds);
      document.title = title + ' - LiveTrans Voice';
      var audio = document.getElementById('lecture-audio');
      if (audio && lecture.audio_url) {
        audio.src = lecture.audio_url;
        audio.dispatchEvent(new CustomEvent('lecture-audio-ready'));
      }
      return lecture;
    }).catch(function (error) {
      toast(error.message || '课堂信息加载失败');
      throw error;
    });
  }

  // ─── 标签弹窗 ─────────────────────────────────
  function showTagPicker(anchorEl, callback) {
    if (!tagPicker) return;
    var rect = anchorEl.getBoundingClientRect();
    var left = Math.max(8, Math.min(rect.left + rect.width / 2 - 80, window.innerWidth - 168));
    var top = rect.bottom + 6;
    if (top + 220 > window.innerHeight) top = rect.top - 220;
    tagPicker.style.left = left + 'px';
    tagPicker.style.top = top + 'px';
    tagPicker.classList.remove('hidden');
    tagPickerCallback = callback;
  }

  function hideTagPicker() {
    if (!tagPicker) return;
    tagPicker.classList.add('hidden');
    tagPickerCallback = null;
  }

  if (tagPicker) {
    tagPicker.querySelectorAll('.tag-option').forEach(function (opt) {
      opt.addEventListener('click', function (e) {
        e.stopPropagation();
        var tag = this.getAttribute('data-tag');
        if (tag && tagPickerCallback) tagPickerCallback(tag);
        hideTagPicker();
      });
    });
  }

  document.addEventListener('click', function (e) {
    if (!tagPicker || tagPicker.classList.contains('hidden')) return;
    if (!tagPicker.contains(e.target)) hideTagPicker();
  });

  // ─── 渲染 ─────────────────────────────────────
  function render() {
    api('/lectures/' + LID + '/transcriptions?limit=400')
    .then(function(transcriptions) {
      var container = document.getElementById('transcript-container');
      if (!container) return;
      container.innerHTML = '';

      if (!transcriptions || !transcriptions.length) {
        container.innerHTML = '<div class="text-center py-12 text-on-surface-variant">暂无转录内容</div>';
        transcriptionsData = [];
        return;
      }

      transcriptionsData = transcriptions;

      transcriptions.forEach(function(t) {
        var isBookmarked = t.is_bookmarked;
        var cls = isBookmarked ? 'bg-orange-50/50 p-4 border-l-4 border-tertiary-container' : 'p-3';
        var starFilled = isBookmarked ? "'FILL' 1" : "'FILL' 0";
        var tagLabel = isBookmarked ? (tagNames[t.bookmark_tag] || '⭐已收藏') : '';

        var div = document.createElement('div');
        div.className = 'group relative hover:bg-surface-container-low ' + cls + ' rounded-lg transition-colors';
        div.id = 'sentence-' + t.sentence_order;
        div.setAttribute('data-trans-id', t.id);
        div.setAttribute('data-sentence-order', t.sentence_order);
        div.setAttribute('data-start-ms', t.start_offset_ms || 0);
        div.innerHTML =
          '<div class="flex justify-between items-start gap-3">' +
            '<div class="flex-1 flex flex-col gap-2">' +
              '<div class="flex items-center gap-2">' +
                '<span class="text-[10px] font-mono text-outline">#' + t.sentence_order + '</span>' +
                (tagLabel ? '<span class="bookmark-badge inline-flex items-center gap-1 self-start px-2 py-0.5 rounded text-[10px] font-bold text-white ' + (tagColors[t.bookmark_tag] || 'bg-primary') + '"><span class="material-symbols-outlined text-[12px]" style="font-variation-settings:\'FILL\' 1;">star</span>' + escapeHtml(tagLabel) + '</span>' : '') +
              '</div>' +
              '<p class="text-body-history-source text-ink-deep">' + escapeHtml(t.source_text || '') + '</p>' +
              '<p class="text-body-history-trans text-secondary">' + escapeHtml(t.translated_text || '') + '</p>' +
            '</div>' +
            '<button class="js-bookmark-btn flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center hover:bg-tertiary-fixed/50 transition-colors" title="' + (isBookmarked ? '取消收藏' : '收藏') + '">' +
              '<span class="material-symbols-outlined text-tertiary text-lg" style="font-variation-settings:' + starFilled + ';">star</span>' +
            '</button>' +
          '</div>';
        container.appendChild(div);

        // 收藏按钮事件
        var btn = div.querySelector('.js-bookmark-btn');
        var starSpan = btn.querySelector('span');
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var tid = parseInt(div.getAttribute('data-trans-id'));
          if (!tid) return;

          if (isBookmarked) {
            api('/bookmarks/by-transcription/' + tid, { method: 'DELETE' })
              .then(function () {
                toast('已取消收藏');
                starSpan.style.fontVariationSettings = "'FILL' 0";
                btn.title = '收藏';
                div.classList.remove('bg-orange-50/50', 'border-l-4', 'border-tertiary-container');
                div.classList.add('p-3');
                var badge = div.querySelector('.bookmark-badge');
                if (badge) badge.remove();
                isBookmarked = false;
              })
              .catch(function (err) { toast(err.message || '取消失败'); });
          } else {
            showTagPicker(btn, function (tag) {
              api('/bookmarks', {
                method: 'POST',
                body: JSON.stringify({ transcription_id: tid, tag: tag })
              })
                .then(function () {
                  toast('已收藏');
                  starSpan.style.fontVariationSettings = "'FILL' 1";
                  btn.title = '取消收藏';
                  div.classList.add('bg-orange-50/50', 'border-l-4', 'border-tertiary-container');
                  div.classList.remove('p-3');
                  var firstChild = div.querySelector('.flex-1');
                  if (firstChild) {
                    var badge = document.createElement('span');
                    badge.className = 'bookmark-badge inline-flex items-center gap-1 self-start px-2 py-0.5 rounded text-[10px] font-bold text-white ' + (tagColors[tag] || 'bg-primary');
                    badge.innerHTML = '<span class="material-symbols-outlined text-[12px]" style="font-variation-settings:\'FILL\' 1;">star</span>' + escapeHtml(tagNames[tag] || tag);
                    firstChild.insertBefore(badge, firstChild.firstChild);
                  }
                  isBookmarked = true;
                })
                .catch(function (err) { toast(err.message || '收藏失败'); });
            });
          }
        });
      });
    })
    .catch(function (err) {
      var container = document.getElementById('transcript-container');
      if (container) container.innerHTML = '<div class="text-center py-12 text-error">加载失败: ' + escapeHtml(err.message) + '</div>';
    });
  }

  // ─── 导出功能 ─────────────────────────────────
  var exportModal = document.getElementById('exportModal');
  var exportFormat = 'word';
  var exportFontSize = 16;

  // 导出按钮 → 打开弹窗
  var exportBtn = document.getElementById('export-btn');
  if (exportBtn) {
    exportBtn.addEventListener('click', function () {
      if (!transcriptionsData.length) { toast('暂无数据可导出'); return; }
      exportModal.classList.remove('hidden');
    });
  }

  // 格式选择
  if (exportModal) {
    exportModal.querySelectorAll('.export-format').forEach(function (btn) {
      btn.addEventListener('click', function () {
        exportModal.querySelectorAll('.export-format').forEach(function (b) {
          b.classList.remove('border-primary', 'bg-primary/5', 'text-primary', 'font-semibold');
          b.classList.add('border-outline-variant', 'text-on-surface-variant', 'font-medium');
        });
        this.classList.add('border-primary', 'bg-primary/5', 'text-primary', 'font-semibold');
        this.classList.remove('border-outline-variant', 'text-on-surface-variant', 'font-medium');
        exportFormat = this.getAttribute('data-format');
      });
    });

    // 字号选择
    exportModal.querySelectorAll('.export-fontsize').forEach(function (btn) {
      btn.addEventListener('click', function () {
        exportModal.querySelectorAll('.export-fontsize').forEach(function (b) {
          b.classList.remove('border-primary', 'bg-primary/5', 'text-primary', 'font-semibold');
          b.classList.add('border-outline-variant', 'text-on-surface-variant', 'font-medium');
        });
        this.classList.add('border-primary', 'bg-primary/5', 'text-primary', 'font-semibold');
        this.classList.remove('border-outline-variant', 'text-on-surface-variant', 'font-medium');
        exportFontSize = parseInt(this.getAttribute('data-size'));
      });
    });

    // 取消
    document.getElementById('exportCancel').addEventListener('click', function () {
      exportModal.classList.add('hidden');
    });

    // 确认导出
    document.getElementById('exportConfirm').addEventListener('click', function () {
      exportModal.classList.add('hidden');
      doExport(exportFormat, exportFontSize);
    });

    // 点击遮罩关闭
    exportModal.addEventListener('click', function (e) {
      if (e.target === exportModal) exportModal.classList.add('hidden');
    });
  }

  function doExport(format, fontSize) {
    if (!transcriptionsData.length) { toast('暂无数据可导出'); return; }
    var title = (document.querySelector('h2') || {}).textContent || '课堂回顾';
    var date = new Date().toLocaleDateString('zh-CN');

    if (format === 'txt') {
      exportTxt(title, date, fontSize);
    } else if (format === 'pdf') {
      exportPdf(title, date, fontSize);
    } else {
      exportWord(title, date, fontSize);
    }
    api('/lectures/' + LID, {
      method: 'PATCH', body: JSON.stringify({ exported: true })
    }).catch(function () {});
  }

  function buildContent(title, date, fontSize) {
    var lines = [];
    lines.push(title);
    lines.push('导出日期: ' + date);
    lines.push('');
    if (currentBriefing && currentBriefing.status === 'ready' && currentBriefing.overview) {
      lines.push('【课堂简报】');
      lines.push(currentBriefing.overview);
      lines.push('');
    }
    transcriptionsData.forEach(function (t, i) {
      lines.push('【' + (i + 1) + '】' + (t.is_bookmarked ? ' [已收藏]' : ''));
      lines.push(t.source_text || '');
      lines.push(t.translated_text || '');
      lines.push('');
    });
    return lines.join('\n');
  }

  function buildHtml(title, date, fontSize) {
    var html = '<html><head><meta charset="utf-8"><title>' + escapeHtml(title) + '</title>';
    html += '<style>body{font-family:"Microsoft YaHei",SimSun,sans-serif;font-size:' + fontSize + 'px;line-height:2;padding:40px;max-width:800px;margin:0 auto;color:#333}h1{font-size:' + (fontSize + 8) + 'px;text-align:center;margin-bottom:8px}.date{text-align:center;color:#999;font-size:' + (fontSize - 2) + 'px;margin-bottom:30px}.item{margin-bottom:24px;padding:12px 16px;border-left:3px solid #1a73e8;background:#f8f9fa}.item.bookmarked{border-left-color:#f97316;background:#fff7ed}.source{color:#1a1c1d;margin-bottom:4px}.trans{color:#5f6368;font-style:italic}.badge{display:inline-block;background:#f97316;color:#fff;padding:2px 8px;border-radius:4px;font-size:' + (fontSize - 4) + 'px;margin-bottom:6px}</style></head><body>';
    html += '<h1>' + escapeHtml(title) + '</h1>';
    html += '<p class="date">导出日期: ' + date + '</p>';
    if (currentBriefing && currentBriefing.status === 'ready' && currentBriefing.overview) {
      html += '<div class="item"><p class="badge">课堂简报</p><p class="source">' + escapeHtml(currentBriefing.overview) + '</p></div>';
    }
    transcriptionsData.forEach(function (t, i) {
      var cls = t.is_bookmarked ? 'item bookmarked' : 'item';
      html += '<div class="' + cls + '">';
      if (t.is_bookmarked) html += '<span class="badge">⭐ 已收藏</span>';
      html += '<p class="source">' + escapeHtml(t.source_text || '') + '</p>';
      html += '<p class="trans">' + escapeHtml(t.translated_text || '') + '</p>';
      html += '</div>';
    });
    html += '</body></html>';
    return html;
  }

  function downloadBlob(content, filename, mimeType) {
    var blob = new Blob(['﻿' + content], { type: mimeType + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('导出完成');
  }

  function exportWord(title, date, fontSize) {
    var html = buildHtml(title, date, fontSize);
    downloadBlob(html, title + '.doc', 'application/msword');
  }

  function exportTxt(title, date, fontSize) {
    var text = buildContent(title, date, fontSize);
    downloadBlob(text, title + '.txt', 'text/plain');
  }

  function exportPdf(title, date, fontSize) {
    var html = buildHtml(title, date, fontSize);
    html = html.replace('<style>', '<style>@media print{@page{size:A4;margin:15mm}}');
    var w = window.open('', '_blank');
    w.document.write(html);
    w.document.close();
    setTimeout(function () { w.print(); }, 500);
  }

  if (TOKEN) {
    loadLectureInfo().then(function () {
      render();
      loadBriefing();
    }).catch(function () {});
  }
  else {
    document.getElementById('transcript-container').innerHTML = '<div class="text-center py-12 text-error">请先<a href="login.html" class="text-primary font-bold">登录</a></div>';
  }
})();
</script>

</body></html>
