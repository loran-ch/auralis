<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LiveTrans Voice - 课堂记录</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/history.css">
<script src="../shared/tailwind-config.js"></script>
<script src="../shared/auth-client.js?v=2"></script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen pb-24">

<!-- Header -->
<header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant/20">
  <div class="flex items-center justify-between px-4 h-16 max-w-screen-xl mx-auto">
    <div class="flex items-center gap-3">
      <button class="hover:bg-surface-variant/50 p-2 rounded-full relative" onclick="document.getElementById('navMenu').classList.toggle('hidden')">
        <span class="material-symbols-outlined text-primary text-2xl">menu</span>
      </button>
      <h1 class="text-lg font-extrabold text-primary tracking-tight">LiveTrans Voice</h1>
    </div>
    <a href="recorder.html" class="bg-primary text-white px-4 py-2 rounded-full text-sm font-semibold hover:opacity-90 transition-opacity flex items-center gap-1">
      <span class="material-symbols-outlined text-lg">add</span>新录音
    </a>
  </div>
</header>

<!-- Dropdown Menu -->
<div id="navMenu" class="hidden fixed top-14 left-4 z-[100] bg-white rounded-2xl shadow-2xl border border-outline-variant/20 py-2 min-w-[180px]">
  <a href="recorder.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low text-sm font-medium"><span class="material-symbols-outlined text-primary">mic</span>实时录音</a>
  <a href="history.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low text-sm font-medium"><span class="material-symbols-outlined text-primary">history</span>课堂记录</a>
  <a href="knowledge-cards.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low text-sm font-medium"><span class="material-symbols-outlined text-primary">star</span>知识卡片</a>
  <a href="profile.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low text-sm font-medium"><span class="material-symbols-outlined text-primary">person</span>个人中心</a>
  <div class="border-t border-outline-variant/10 my-1"></div>
  <a href="login.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low text-sm font-medium text-error"><span class="material-symbols-outlined">logout</span>退出登录</a>
</div>

<!-- Main -->
<main class="pt-20 px-4 max-w-3xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-3xl font-extrabold text-on-surface">课堂记录</h2>
      <p class="text-sm text-on-surface-variant mt-1">所有已完成的课堂录音</p>
    </div>
  </div>

  <div class="relative mb-3">
    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
    <input id="search" class="w-full pl-12 pr-4 py-3.5 bg-white rounded-xl border-none shadow-sm focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline/60" placeholder="搜索课堂记录..." type="text">
  </div>

  <!-- Date Filter -->
  <div class="flex items-center gap-2 mb-6">
    <input id="date-from" type="date" class="flex-1 px-3 py-2.5 bg-white rounded-xl border-none shadow-sm focus:ring-2 focus:ring-primary/20 text-sm text-on-surface">
    <span class="text-outline text-sm">至</span>
    <input id="date-to" type="date" class="flex-1 px-3 py-2.5 bg-white rounded-xl border-none shadow-sm focus:ring-2 focus:ring-primary/20 text-sm text-on-surface">
    <button id="date-clear" class="flex-shrink-0 px-3 py-2.5 text-xs text-primary font-medium hover:bg-primary/5 rounded-xl transition-colors hidden">清除</button>
  </div>

<!-- 删除确认弹窗 -->
<div id="deleteModal" class="hidden fixed inset-0 z-70 bg-black/30 flex items-center justify-center">
  <div class="bg-white rounded-2xl w-[90%] max-w-sm p-6 shadow-2xl text-center">
    <span class="material-symbols-outlined text-5xl text-error mb-2">warning</span>
    <h3 class="text-lg font-bold text-on-surface mb-1">确认删除</h3>
    <p class="text-sm text-on-surface-variant mb-6" id="deleteModalMsg">确认删除选中的记录？</p>
    <div class="flex gap-3">
      <button id="deleteCancel" class="flex-1 py-3 text-secondary font-medium hover:bg-surface-container-low rounded-xl transition-colors">取消</button>
      <button id="deleteConfirm" class="flex-1 py-3 bg-error text-white font-semibold rounded-xl hover:opacity-90 transition-opacity">确认删除</button>
    </div>
  </div>
</div>

<!-- Batch Actions -->
  <div id="batch-bar" class="flex items-center justify-between mb-3 hidden">
    <label class="flex items-center gap-2 cursor-pointer text-sm text-on-surface-variant select-none">
      <input id="select-all" type="checkbox" class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20">
      全选
    </label>
    <span id="selected-count" class="text-xs text-error font-medium">已选 0 项</span>
    <button id="batch-delete" class="px-4 py-2 bg-error text-white text-sm font-semibold rounded-xl hover:opacity-90 transition-opacity flex items-center gap-1">
      <span class="material-symbols-outlined text-lg">delete</span>批量删除
    </button>
  </div>

  <div id="list" class="space-y-3"></div>
</main>

<!-- Bottom Nav -->
<nav class="fixed bottom-0 w-full z-50 bg-white/90 backdrop-blur-xl border-t border-outline-variant/20 flex justify-around items-center h-20 pb-2 px-4">
  <a href="history.html" class="flex flex-col items-center gap-1 text-primary font-bold">
    <span class="material-symbols-outlined text-2xl" style="font-variation-settings:'FILL' 1;">history</span>
    <span class="text-[10px] font-semibold uppercase tracking-wider">记录</span>
  </a>
  <a href="recorder.html" class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
    <span class="material-symbols-outlined text-2xl">mic</span>
    <span class="text-[10px] font-semibold uppercase tracking-wider">录音</span>
  </a>
  <a href="knowledge-cards.html" class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
    <span class="material-symbols-outlined text-2xl">star</span>
    <span class="text-[10px] font-semibold uppercase tracking-wider">收藏</span>
  </a>
  <a href="profile.html" class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
    <span class="material-symbols-outlined text-2xl">person</span>
    <span class="text-[10px] font-semibold uppercase tracking-wider">我的</span>
  </a>
</nav>

<script>
var TOKEN = localStorage.getItem('livetrans_token');
var el = document.getElementById('list');
var searchEl = document.getElementById('search');

function fmtMin(s) { var m = Math.floor((s||0)/60); return m + ' 分钟'; }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('zh-CN') : ''; }
function fmtTime(d) { return d ? new Date(d).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) : ''; }

var currentPage = 1;
var totalPages = 1;
var currentSearch = '';
var currentDateFrom = '';
var currentDateTo = '';
var searchTimer = null;
var dateFromEl = document.getElementById('date-from');
var dateToEl = document.getElementById('date-to');
var dateClearEl = document.getElementById('date-clear');

function renderCards(result) {
  var data = result.items || result;
  var total = result.total || (data ? data.length : 0);
  var page = result.page || 1;
  var pages = result.pages || 1;
  currentPage = page;
  totalPages = pages;

  var html = '';

  // 搜索无结果
  if (!data || !data.length) {
    if (currentSearch) {
      html = '<div class="text-center py-16"><span class="material-symbols-outlined text-5xl text-outline/30 mb-4 block">search_off</span><p class="text-on-surface-variant">未找到「<b>' + escapeHtml(currentSearch) + '</b>」相关记录</p><p class="text-sm text-outline mt-2"><button onclick="clearSearch()" class="text-primary font-semibold hover:underline">清除搜索</button></p></div>';
    } else {
      html = '<div class="text-center py-16"><span class="material-symbols-outlined text-5xl text-outline/30 mb-4 block">folder_open</span><p class="text-on-surface-variant">暂无课堂记录</p><p class="text-sm text-outline mt-2">去<a href="recorder.html" class="text-primary font-semibold">录音</a>开始第一堂课</p></div>';
    }
    el.innerHTML = html;
    return;
  }

  var startNum = (page - 1) * 15;
  data.forEach(function(l, idx) {
    var d = fmtDate(l.started_at);
    var t = fmtTime(l.started_at);
    var min = fmtMin(l.duration_seconds);
    var bookmarked = l.bookmark_count > 0;
    var num = startNum + idx + 1;
    // 高亮搜索关键词
    var displayName = l.course_name || '未命名';
    if (currentSearch) {
      displayName = highlightMatch(displayName, currentSearch);
    }

    html += '<div class="group bg-white rounded-2xl p-5 shadow-sm border border-outline-variant/10 hover:shadow-md hover:border-primary/20 transition-all cursor-pointer" onclick="location.href=\'review.html?id='+l.id+'\'">';
    html += '<div class="flex items-center gap-3 mb-2">';
    html += '<div class="flex-shrink-0 p-1 -m-1 rounded-lg hover:bg-surface-variant/30 transition-colors cursor-pointer" onclick="event.stopPropagation();var cb=this.parentElement.querySelector(\'.lecture-checkbox\');cb.checked=!cb.checked;cb.dispatchEvent(new Event(\'change\'))">';
    html += '<input type="checkbox" class="lecture-checkbox w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20 pointer-events-none" data-id="'+l.id+'" title="选择此项">';
    html += '</div>';
    html += '<span class="text-sm font-extrabold text-primary">#'+num+'</span><span class="text-sm font-semibold text-on-surface-variant">'+d+'</span><span class="text-sm text-outline">'+t+'</span></div>';
    html += '<div class="flex justify-between items-start mb-3">';
    html += '<div class="flex-1"><h3 class="text-lg font-bold text-on-surface group-hover:text-primary transition-colors">'+displayName+'</h3>';
    html += '<p class="text-xs text-outline mt-1 flex items-center gap-3"><span class="px-2 py-0.5 bg-primary/5 rounded-full text-primary text-[10px] font-semibold">'+escapeHtml(l.source_lang||'')+' → '+escapeHtml(l.target_lang||'')+'</span></p></div>';
    html += '<div class="flex items-center gap-3">';
    if (bookmarked) html += '<span class="flex items-center gap-1 text-tertiary text-xs font-semibold"><span class="material-symbols-outlined text-sm" style="font-variation-settings:\'FILL\' 1;">star</span>'+l.bookmark_count+'</span>';
    html += '<span class="bg-primary/5 text-primary text-xs font-bold px-3 py-1.5 rounded-full">'+min+'</span>';
    html += '</div></div>';
    html += '<div class="flex items-center justify-between"><p class="text-sm text-on-surface-variant">'+l.sentence_count+' 个句子</p>';
    html += '<button class="text-error/60 hover:text-error hover:bg-error/5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1" onclick="event.stopPropagation();del('+l.id+')"><span class="material-symbols-outlined text-sm">delete</span>删除</button>';
    html += '</div></div>';
  });

  // Pagination — 搜索结果过多时也显示分页
  if (pages > 1) {
    html += '<div class="flex items-center justify-center gap-2 py-4">';
    html += '<button class="px-4 py-2 rounded-lg text-sm font-semibold '+(page<=1?'text-outline/30 cursor-default':'text-primary hover:bg-primary/5')+'" '+(page<=1?'disabled':'onclick="goPage('+(page-1)+')"')+'>← 上一页</button>';
    html += '<span class="text-sm text-on-surface-variant px-3">'+page+' / '+pages+'</span>';
    html += '<button class="px-4 py-2 rounded-lg text-sm font-semibold '+(page>=pages?'text-outline/30 cursor-default':'text-primary hover:bg-primary/5')+'" '+(page>=pages?'disabled':'onclick="goPage('+(page+1)+')"')+'>下一页 →</button>';
    html += '</div>';
  }
  html += '<p class="text-center text-xs text-outline">共 '+total+' 条记录' + (currentSearch ? '（搜索: ' + escapeHtml(currentSearch) + '）' : '') + '</p>';

  el.innerHTML = html;
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str || ''));
  return div.innerHTML;
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  var escaped = escapeHtml(text);
  var q = escapeHtml(query);
  // 对已转义的文本做不区分大小写的匹配高亮
  var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escaped.replace(re, '<mark class="bg-yellow-200 rounded px-0.5">$1</mark>');
}

function goPage(p) { loadPage(p, currentSearch, currentDateFrom, currentDateTo); }

function loadPage(p, search, dateFrom, dateTo) {
  el.innerHTML = '<div class="text-center py-12 text-on-surface-variant">加载中...</div>';
  var url = '/api/lectures?page='+p+'&size=15';
  if (search) url += '&search=' + encodeURIComponent(search);
  if (dateFrom) url += '&date_from=' + encodeURIComponent(dateFrom);
  if (dateTo) url += '&date_to=' + encodeURIComponent(dateTo);
  fetch(url, { headers: { 'Authorization': 'Bearer ' + TOKEN } })
    .then(function(r) { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(renderCards)
    .catch(function() { el.innerHTML = '<div class="text-center py-12 text-error">加载失败 <button onclick="location.reload()" class="text-primary underline ml-2">重试</button></div>'; });
}

// ─── 搜索（防抖 350ms）──────────────────────────
if (searchEl) {
  searchEl.addEventListener('input', function () {
    var q = this.value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      currentSearch = q;
      currentPage = 1;
      loadPage(1, q);
    }, 350);
  });

  // 清空按钮：在输入框右侧加一个 X
  searchEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { this.value = ''; clearSearch(); }
  });
}

function clearSearch() {
  if (searchEl) searchEl.value = '';
  currentSearch = '';
  currentPage = 1;
  loadPage(1, '');
}

// ─── 删除 ──────────────────────────────────────
function del(id) {
  if (confirm('确认删除该课堂记录？\n相关的转录和收藏也会被删除。')) {
    fetch('/api/lectures/' + id, {
      method: 'DELETE', headers: { 'Authorization': 'Bearer ' + TOKEN }
    }).then(function(r) { if (r.ok) loadPage(currentPage, currentSearch); else alert('删除失败'); });
  }
}

// ─── 日期筛选 ──────────────────────────────────
function applyDateFilter() {
  currentDateFrom = dateFromEl ? dateFromEl.value : '';
  currentDateTo = dateToEl ? dateToEl.value : '';
  currentPage = 1;
  if (dateClearEl) {
    dateClearEl.style.display = (currentDateFrom || currentDateTo) ? '' : 'none';
  }
  loadPage(1, currentSearch, currentDateFrom, currentDateTo);
}

if (dateFromEl) dateFromEl.addEventListener('change', applyDateFilter);
if (dateToEl) dateToEl.addEventListener('change', applyDateFilter);
if (dateClearEl) {
  dateClearEl.addEventListener('click', function () {
    if (dateFromEl) dateFromEl.value = '';
    if (dateToEl) dateToEl.value = '';
    applyDateFilter();
  });
}

// ─── 多选删除 ──────────────────────────────────
var selectedIds = [];

function updateBatchBar() {
  var bar = document.getElementById('batch-bar');
  var countEl = document.getElementById('selected-count');
  if (!bar || !countEl) return;
  if (selectedIds.length > 0) {
    bar.classList.remove('hidden');
    countEl.textContent = '已选 ' + selectedIds.length + ' 项';
  } else {
    bar.classList.add('hidden');
  }
}

// 全选/取消全选
var selectAllEl = document.getElementById('select-all');
if (selectAllEl) {
  selectAllEl.addEventListener('change', function () {
    var checked = this.checked;
    var boxes = document.querySelectorAll('.lecture-checkbox');
    selectedIds = [];
    boxes.forEach(function (cb) {
      cb.checked = checked;
      if (checked) {
        var id = parseInt(cb.getAttribute('data-id'));
        if (id) selectedIds.push(id);
      }
    });
    updateBatchBar();
  });
}

// 监听列表变化，更新复选框事件
function refreshCheckboxListeners() {
  var boxes = document.querySelectorAll('.lecture-checkbox');
  boxes.forEach(function (cb) {
    if (cb._listenerAdded) return;
    cb._listenerAdded = true;
    cb.addEventListener('change', function () {
      var id = parseInt(this.getAttribute('data-id'));
      if (this.checked) {
        if (selectedIds.indexOf(id) === -1) selectedIds.push(id);
      } else {
        selectedIds = selectedIds.filter(function (x) { return x !== id; });
        if (selectAllEl) selectAllEl.checked = false;
      }
      updateBatchBar();
    });
  });
  // 清除已不在列表中的 ID
  var currentIds = [];
  boxes.forEach(function (cb) { currentIds.push(parseInt(cb.getAttribute('data-id'))); });
  selectedIds = selectedIds.filter(function (id) { return currentIds.indexOf(id) !== -1; });
  updateBatchBar();
}

// 批量删除 — 页面内确认弹窗
var deleteModal = document.getElementById('deleteModal');
var deleteModalMsg = document.getElementById('deleteModalMsg');
var deleteCancel = document.getElementById('deleteCancel');
var deleteConfirmBtn = document.getElementById('deleteConfirm');

function showDeleteModal(count) {
  if (!deleteModal) return;
  deleteModalMsg.textContent = '确认删除选中的 ' + count + ' 条记录？相关的转录和收藏也会被删除。';
  deleteModal.classList.remove('hidden');
}

function hideDeleteModal() {
  if (deleteModal) deleteModal.classList.add('hidden');
}

if (deleteCancel) deleteCancel.addEventListener('click', hideDeleteModal);
if (deleteModal) {
  deleteModal.addEventListener('click', function (e) {
    if (e.target === deleteModal) hideDeleteModal();
  });
}

var batchDeleteBtn = document.getElementById('batch-delete');
if (batchDeleteBtn) {
  batchDeleteBtn.addEventListener('click', function () {
    if (!selectedIds.length) return;
    showDeleteModal(selectedIds.length);
  });
}

if (deleteConfirmBtn) {
  deleteConfirmBtn.addEventListener('click', function () {
    hideDeleteModal();
    var ids = selectedIds.slice();
    fetch('/api/lectures/batch-delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
      body: JSON.stringify({ ids: ids })
    }).then(function (response) {
      if (!response.ok) throw new Error('批量删除失败');
      return response.json();
    }).then(function (result) {
      toastMsg(result.message || ('已删除 ' + ids.length + ' 条记录'));
      selectedIds = [];
      if (selectAllEl) selectAllEl.checked = false;
      updateBatchBar();
      loadPage(currentPage, currentSearch, currentDateFrom, currentDateTo);
    }).catch(function () { toastMsg('部分删除失败'); });
  });
}

// toast
function toastMsg(msg) {
  var t = document.createElement('div');
  t.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full text-sm shadow-lg z-[100]';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 2500);
}

// 每次渲染后刷新复选框事件
var origRenderCards = renderCards;
renderCards = function (result) {
  selectedIds = [];
  if (selectAllEl) selectAllEl.checked = false;
  updateBatchBar();
  origRenderCards(result);
  setTimeout(refreshCheckboxListeners, 50);
};

// ─── 初始化 ────────────────────────────────────
if (!TOKEN) {
  el.innerHTML = '<div class="text-center py-16"><span class="material-symbols-outlined text-5xl text-outline/30 mb-4 block">lock</span><p class="text-on-surface-variant">请先<a href="login.html" class="text-primary font-bold">登录</a></p></div>';
} else {
  loadPage(1, '');
}

// ─── 菜单关闭 ──────────────────────────────────
document.addEventListener('click', function(e) {
  var m = document.getElementById('navMenu');
  if (m && !m.classList.contains('hidden') && !e.target.closest('#navMenu') && !e.target.closest('button[onclick*="navMenu"]')) {
    m.classList.add('hidden');
  }
});
</script>
</body>
</html>
