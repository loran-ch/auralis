<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LiveTrans Voice - 课堂记录</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/history.css">
<script src="../shared/tailwind-config.js"></script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen pb-24">

<!-- Header -->
<header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant/20">
  <div class="flex items-center justify-between px-4 h-16 max-w-screen-xl mx-auto">
    <div class="flex items-center gap-3">
      <button class="hover:bg-surface-variant/50 p-2 rounded-full relative" onclick="document.getElementById('navMenu').classList.toggle('hidden')">
        <span class="material-symbols-outlined text-primary text-2xl">menu</span>
      </button>
      <h1 class="text-lg font-extrabold text-primary tracking-tight">LiveTrans Voice</h1>
    </div>
    <a href="recorder.html" class="bg-primary text-white px-4 py-2 rounded-full text-sm font-semibold hover:opacity-90 transition-opacity flex items-center gap-1">
      <span class="material-symbols-outlined text-lg">add</span>新录音
    </a>
  </div>
</header>

<!-- Dropdown Menu -->
<div id="navMenu" class="hidden fixed top-14 left-4 z-[100] bg-white rounded-2xl shadow-2xl border border-outline-variant/20 py-2 min-w-[180px]">
  <a href="recorder.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low text-sm font-medium"><span class="material-symbols-outlined text-primary">mic</span>实时录音</a>
  <a href="history.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low text-sm font-medium"><span class="material-symbols-outlined text-primary">history</span>课堂记录</a>
  <a href="knowledge-cards.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low text-sm font-medium"><span class="material-symbols-outlined text-primary">star</span>知识卡片</a>
  <a href="profile.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low text-sm font-medium"><span class="material-symbols-outlined text-primary">person</span>个人中心</a>
  <div class="border-t border-outline-variant/10 my-1"></div>
  <a href="login.html" class="flex items-center gap-3 px-5 py-3 hover:bg-surface-container-low text-sm font-medium text-error"><span class="material-symbols-outlined">logout</span>退出登录</a>
</div>

<!-- Main -->
<main class="pt-20 px-4 max-w-3xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-3xl font-extrabold text-on-surface">课堂记录</h2>
      <p class="text-sm text-on-surface-variant mt-1">所有已完成的课堂录音</p>
    </div>
  </div>

  <div class="relative mb-6">
    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
    <input id="search" class="w-full pl-12 pr-4 py-3.5 bg-white rounded-xl border-none shadow-sm focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline/60" placeholder="搜索课堂记录..." type="text">
  </div>

  <div id="list" class="space-y-3"></div>
</main>

<!-- Bottom Nav -->
<nav class="fixed bottom-0 w-full z-50 bg-white/90 backdrop-blur-xl border-t border-outline-variant/20 flex justify-around items-center h-20 pb-2 px-4">
  <a href="history.html" class="flex flex-col items-center gap-1 text-primary font-bold">
    <span class="material-symbols-outlined text-2xl" style="font-variation-settings:'FILL' 1;">history</span>
    <span class="text-[10px] font-semibold uppercase tracking-wider">记录</span>
  </a>
  <a href="recorder.html" class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
    <span class="material-symbols-outlined text-2xl">mic</span>
    <span class="text-[10px] font-semibold uppercase tracking-wider">录音</span>
  </a>
  <a href="knowledge-cards.html" class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
    <span class="material-symbols-outlined text-2xl">star</span>
    <span class="text-[10px] font-semibold uppercase tracking-wider">收藏</span>
  </a>
  <a href="profile.html" class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
    <span class="material-symbols-outlined text-2xl">person</span>
    <span class="text-[10px] font-semibold uppercase tracking-wider">我的</span>
  </a>
</nav>

<script>
var TOKEN = localStorage.getItem('livetrans_token');
var el = document.getElementById('list');

function fmtMin(s) { var m = Math.floor((s||0)/60); return m + ' 分钟'; }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('zh-CN') : ''; }
function fmtTime(d) { return d ? new Date(d).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) : ''; }

var currentPage = 1;
var totalPages = 1;

function renderCards(result) {
  var data = result.items || result;
  var total = result.total || data.length;
  var page = result.page || 1;
  var pages = result.pages || 1;
  currentPage = page;
  totalPages = pages;

  var html = '';
  if (!data || !data.length) {
    el.innerHTML = '<div class="text-center py-16"><span class="material-symbols-outlined text-5xl text-outline/30 mb-4">folder_open</span><p class="text-on-surface-variant">暂无课堂记录</p><p class="text-sm text-outline mt-2">去<a href="recorder.html" class="text-primary font-semibold">录音</a>开始第一堂课</p></div>';
    return;
  }
  var startNum = (page - 1) * 15;
  data.forEach(function(l, idx) {
    var d = fmtDate(l.started_at);
    var t = fmtTime(l.started_at);
    var min = fmtMin(l.duration_seconds);
    var bookmarked = l.bookmark_count > 0;
    var num = startNum + idx + 1;
    html += '<div class="group bg-white rounded-2xl p-5 shadow-sm border border-outline-variant/10 hover:shadow-md hover:border-primary/20 transition-all cursor-pointer" onclick="location.href=\'review.html?id='+l.id+'\'">';
    html += '<div class="flex items-center gap-3 mb-2"><span class="text-sm font-extrabold text-primary">#'+num+'</span><span class="text-sm font-semibold text-on-surface-variant">'+d+'</span><span class="text-sm text-outline">'+t+'</span></div>';
    html += '<div class="flex justify-between items-start mb-3">';
    html += '<div class="flex-1"><h3 class="text-lg font-bold text-on-surface group-hover:text-primary transition-colors">'+l.course_name+'</h3>';
    html += '<p class="text-xs text-outline mt-1 flex items-center gap-3"><span class="px-2 py-0.5 bg-primary/5 rounded-full text-primary text-[10px] font-semibold">'+l.source_lang+' → '+l.target_lang+'</span></p></div>';
    html += '<div class="flex items-center gap-3">';
    if (bookmarked) html += '<span class="flex items-center gap-1 text-tertiary text-xs font-semibold"><span class="material-symbols-outlined text-sm" style="font-variation-settings:\'FILL\' 1;">star</span>'+l.bookmark_count+'</span>';
    html += '<span class="bg-primary/5 text-primary text-xs font-bold px-3 py-1.5 rounded-full">'+min+'</span>';
    html += '</div></div>';
    html += '<div class="flex items-center justify-between"><p class="text-sm text-on-surface-variant">'+l.sentence_count+' 个句子</p>';
    html += '<button class="text-error/60 hover:text-error hover:bg-error/5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1" onclick="event.stopPropagation();del('+l.id+',\''+(l.course_name||'未命名')+'\')"><span class="material-symbols-outlined text-sm">delete</span>删除</button>';
    html += '</div></div>';
  });

  // Pagination
  if (pages > 1) {
    html += '<div class="flex items-center justify-center gap-2 py-4">';
    html += '<button class="px-4 py-2 rounded-lg text-sm font-semibold '+(page<=1?'text-outline/30':'text-primary hover:bg-primary/5')+'" '+(page<=1?'disabled':'onclick="goPage('+(page-1)+')"')+'>← 上一页</button>';
    html += '<span class="text-sm text-on-surface-variant px-3">'+page+' / '+pages+'</span>';
    html += '<button class="px-4 py-2 rounded-lg text-sm font-semibold '+(page>=pages?'text-outline/30':'text-primary hover:bg-primary/5')+'" '+(page>=pages?'disabled':'onclick="goPage('+(page+1)+')"')+'>下一页 →</button>';
    html += '</div>';
  }
  html += '<p class="text-center text-xs text-outline">共 '+total+' 条记录</p>';

  el.innerHTML = html;
}

function goPage(p) { loadPage(p); }

function loadPage(p) {
  el.innerHTML = '<div class="text-center py-12 text-on-surface-variant">加载中...</div>';
  fetch('/api/lectures?page='+p+'&size=15', { headers: { 'Authorization': 'Bearer ' + TOKEN } })
    .then(function(r) { return r.json(); })
    .then(renderCards)
    .catch(function() { el.innerHTML = '<div class="text-center py-12 text-error">加载失败 <button onclick="location.reload()" class="text-primary underline ml-2">重试</button></div>'; });
}

if (!TOKEN) {
  el.innerHTML = '<div class="text-center py-16"><span class="material-symbols-outlined text-5xl text-outline/30 mb-4">lock</span><p class="text-on-surface-variant">请先<a href="login.html" class="text-primary font-bold">登录</a></p></div>';
} else {
  loadPage(1);
}

function del(id, name) {
  if (confirm('确认删除「' + name + '」？\n相关的转录和收藏也会被删除。')) {
    fetch('/api/lectures/' + id, {
      method: 'DELETE', headers: { 'Authorization': 'Bearer ' + TOKEN }
    }).then(function(r) { if (r.ok) location.reload(); else alert('删除失败'); });
  }
}

document.getElementById('search').addEventListener('input', function() {
  var q = this.value.toLowerCase();
  document.querySelectorAll('#list > div').forEach(function(c) {
    c.style.display = c.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
  });
});

// Close dropdown on outside click
document.addEventListener('click', function(e) {
  var m = document.getElementById('navMenu');
  if (m && !m.classList.contains('hidden') && !e.target.closest('#navMenu') && !e.target.closest('button[onclick*="navMenu"]')) {
    m.classList.add('hidden');
  }
});
</script>
</body>
</html>
