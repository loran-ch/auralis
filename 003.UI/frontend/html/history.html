  <script>
// ─── 自动登录 + 加载课堂记录 ──────────────────────
(function(){
  var TOKEN = localStorage.getItem('livetrans_token');

  function loadData() {
    fetch('/api/lectures', { headers: { 'Authorization': 'Bearer ' + TOKEN } })
      .then(function(r) { return r.json(); })
      .then(function(list) {
        var c = document.getElementById('records-container');
        if (!c) return;
        c.innerHTML = '';
        if (!list || !list.length) {
          document.getElementById('empty-state').classList.remove('hidden');
          return;
        }
        document.getElementById('empty-state').classList.add('hidden');
        list.forEach(function(l) {
          var dt = l.started_at ? new Date(l.started_at) : new Date();
          var d = dt.getFullYear()+"/"+(dt.getMonth()+1)+"/"+dt.getDate(); var t = String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0");
          var el = document.createElement('div');
          el.className = 'bg-surface-container-lowest rounded-xl p-4 card-shadow hover:scale-[1.01] transition-transform duration-200 cursor-pointer border border-outline-variant/20';
          el.onclick = function(){ window.location.href = 'review.html?id=' + l.id; };
          el.innerHTML =
            '<div class="flex justify-between items-start mb-2">'+
              '<div><h3 class="font-display-current-source text-lg text-ink-deep">'+(l.course_name||'未命名')+'</h3>'+
              '<p class="font-caption-timestamp text-ink-subdued">'+d+' · '+t+'</p></div>'+
              '<div class="flex flex-col items-end">'+
                '<span class="font-label-tag text-primary bg-primary-container/20 px-2 py-1 rounded-lg">'+Math.floor((l.duration_seconds||0)/60)+':'+String((l.duration_seconds||0)%60).padStart(2,'0')+'</span>'+
                (l.bookmark_count>0?'<div class="flex items-center gap-1 mt-1 text-tertiary"><span class="material-symbols-outlined text-[14px]" style="font-variation-settings:\'FILL\' 1;">star</span><span class="font-label-tag">'+l.bookmark_count+'</span></div>':'')+
              '</div></div>'+
            '<p class="text-on-surface-variant line-clamp-2 mt-2 italic border-l-2 border-primary-container pl-3">'+(l.source_lang||'')+' → '+(l.target_lang||'')+' | '+(l.sentence_count||0)+' 句话</p>';
          c.appendChild(el);
        });
      })
      .catch(function() {
        document.getElementById('records-container').innerHTML = '';
        document.getElementById('empty-state').classList.remove('hidden');
      });
  }

  if (TOKEN) {
    loadData();

})();
</script>
<script defer src="../js/history.js"></script>
</head>
