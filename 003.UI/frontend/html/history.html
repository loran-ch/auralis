<script>
var TOKEN = localStorage.getItem('livetrans_token');
var el = document.getElementById('list');
var searchEl = document.getElementById('search');

function fmtMin(s) { var m = Math.floor((s||0)/60); return m + ' 分钟'; }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('zh-CN') : ''; }
function fmtTime(d) { return d ? new Date(d).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) : ''; }

var currentPage = 1;
var totalPages = 1;
var currentSearch = '';
var currentDateFrom = '';
var currentDateTo = '';
var searchTimer = null;
var dateFromEl = document.getElementById('date-from');
var dateToEl = document.getElementById('date-to');
var dateClearEl = document.getElementById('date-clear');
var courseFilterEl = document.getElementById('course-filter');
var currentCourseFilter = '';
var lectureTitlesById = {};

function renderCards(result) {
  var data = result.items || result;
  var total = result.total || (data ? data.length : 0);
  var page = result.page || 1;
  var pages = result.pages || 1;
  currentPage = page;
  totalPages = pages;

  var html = '';
  lectureTitlesById = {};

  // 搜索无结果
  if (!data || !data.length) {
    if (currentSearch) {
      html = '<div class="text-center py-16"><span class="material-symbols-outlined text-5xl text-outline/30 mb-4 block">search_off</span><p class="text-on-surface-variant">未找到「<b>' + escapeHtml(currentSearch) + '</b>」相关记录</p><p class="text-sm text-outline mt-2"><button onclick="clearSearch()" class="text-primary font-semibold hover:underline">清除搜索</button></p></div>';
    } else {
      html = '<div class="text-center py-16"><span class="material-symbols-outlined text-5xl text-outline/30 mb-4 block">folder_open</span><p class="text-on-surface-variant">暂无课堂记录</p><p class="text-sm text-outline mt-2">去<a href="recorder.html" class="text-primary font-semibold">录音</a>开始第一堂课</p></div>';
    }
    el.innerHTML = html;
    return;
  }

  var startNum = (page - 1) * 15;
  data.forEach(function(l, idx) {
    var d = fmtDate(l.started_at);
    var t = fmtTime(l.started_at);
    var min = fmtMin(l.duration_seconds);
    var bookmarked = l.bookmark_count > 0;
    var num = startNum + idx + 1;
    // 高亮搜索关键词
    var rawDisplayName = l.title || (l.session_number ? (l.course_name || '未命名') + ' · 第 ' + l.session_number + ' 节课' : (l.course_name || '未命名'));
    lectureTitlesById[String(l.id)] = rawDisplayName;
    var displayName = escapeHtml(rawDisplayName);
    if (currentSearch) {
      displayName = highlightMatch(rawDisplayName, currentSearch);
    }

    html += '<div class="group bg-white rounded-2xl p-5 shadow-sm border border-outline-variant/10 hover:shadow-md hover:border-primary/20 transition-all cursor-pointer" onclick="location.href=\'review.html?id='+l.id+'\'">';
    html += '<div class="flex items-center gap-3 mb-2">';
    html += '<div class="flex-shrink-0 p-1 -m-1 rounded-lg hover:bg-surface-variant/30 transition-colors cursor-pointer" onclick="event.stopPropagation();var cb=this.parentElement.querySelector(\'.lecture-checkbox\');cb.checked=!cb.checked;cb.dispatchEvent(new Event(\'change\'))">';
    html += '<input type="checkbox" class="lecture-checkbox w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20 pointer-events-none" data-id="'+l.id+'" title="选择此项">';
    html += '</div>';
    html += '<span class="text-sm font-extrabold text-primary">#'+num+'</span><span class="text-sm font-semibold text-on-surface-variant">'+d+'</span><span class="text-sm text-outline">'+t+'</span></div>';
    html += '<div class="flex justify-between items-start mb-3">';
    html += '<div class="flex-1"><h3 class="text-lg font-bold text-on-surface group-hover:text-primary transition-colors">'+displayName+'</h3>';
    var languageLabel = l.translation_enabled === false ? escapeHtml(l.source_lang||'') + ' · 仅记录' : escapeHtml(l.source_lang||'')+' → '+escapeHtml(l.target_lang||'');
    html += '<p class="text-xs text-outline mt-1 flex items-center gap-3"><span class="px-2 py-0.5 bg-primary/5 rounded-full text-primary text-[10px] font-semibold">'+languageLabel+'</span></p></div>';
    html += '<div class="flex items-center gap-3">';
    if (bookmarked) html += '<span class="flex items-center gap-1 text-tertiary text-xs font-semibold"><span class="material-symbols-outlined text-sm" style="font-variation-settings:\'FILL\' 1;">star</span>'+l.bookmark_count+'</span>';
    html += '<span class="bg-primary/5 text-primary text-xs font-bold px-3 py-1.5 rounded-full">'+min+'</span>';
    html += '</div></div>';
    html += '<div class="flex items-center justify-between gap-2 flex-wrap"><p class="text-sm text-on-surface-variant">'+l.sentence_count+' 个句子</p>';
    html += '<div class="flex items-center gap-1 flex-wrap" onclick="event.stopPropagation()">';
    html += '<button type="button" class="text-primary hover:bg-primary/5 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1" onclick="appendRecording('+l.id+')" title="在已有字幕后续录"><span class="material-symbols-outlined text-sm">mic</span>追加录音</button>';
    html += '<label class="text-primary/80 hover:text-primary hover:bg-primary/5 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1 cursor-pointer" title="上传课件/PDF/图片">';
    html += '<span class="material-symbols-outlined text-sm">upload_file</span>上传资料';
    html += '<input type="file" class="hidden js-history-upload" data-id="'+l.id+'" accept=".jpg,.jpeg,.png,.webp,.pdf,.ppt,.pptx,image/*,application/pdf,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation">';
    html += '</label>';
    html += '<button type="button" class="text-primary/80 hover:text-primary hover:bg-primary/5 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1" onclick="exportBriefing('+l.id+', this)" title="导出简报 Markdown"><span class="material-symbols-outlined text-sm">description</span>导出简报</button>';
    html += '<button type="button" class="text-primary/80 hover:text-primary hover:bg-primary/5 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1" onclick="downloadMaterials('+l.id+', this)" title="打包下载简报与附件"><span class="material-symbols-outlined text-sm">folder_zip</span>资料包</button>';
    if (l.can_manage !== false) html += '<button type="button" class="text-primary/80 hover:text-primary hover:bg-primary/5 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1" onclick="openRenameModal('+l.id+')" title="修改课堂名称"><span class="material-symbols-outlined text-sm">edit</span>修改名称</button>';
    html += '<button class="text-error/60 hover:text-error hover:bg-error/5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1" onclick="del('+l.id+')"><span class="material-symbols-outlined text-sm">delete</span>删除</button>';
    html += '</div></div></div>';
  });

  // Pagination — 搜索结果过多时也显示分页
  if (pages > 1) {
    html += '<div class="flex items-center justify-center gap-2 py-4">';
    html += '<button class="px-4 py-2 rounded-lg text-sm font-semibold '+(page<=1?'text-outline/30 cursor-default':'text-primary hover:bg-primary/5')+'" '+(page<=1?'disabled':'onclick="goPage('+(page-1)+')"')+'>← 上一页</button>';
    html += '<span class="text-sm text-on-surface-variant px-3">'+page+' / '+pages+'</span>';
    html += '<button class="px-4 py-2 rounded-lg text-sm font-semibold '+(page>=pages?'text-outline/30 cursor-default':'text-primary hover:bg-primary/5')+'" '+(page>=pages?'disabled':'onclick="goPage('+(page+1)+')"')+'>下一页 →</button>';
    html += '</div>';
  }
  html += '<p class="text-center text-xs text-outline">共 '+total+' 条记录' + (currentSearch ? '（搜索: ' + escapeHtml(currentSearch) + '）' : '') + '</p>';

  el.innerHTML = html;
  bindHistoryMaterialActions();
}

function historyToast(message) {
  var existing = document.getElementById('history-toast');
  if (existing) existing.remove();
  var node = document.createElement('div');
  node.id = 'history-toast';
  node.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 z-[90] max-w-[90%] rounded-xl bg-on-surface px-4 py-2.5 text-sm text-white shadow-lg';
  node.textContent = message;
  document.body.appendChild(node);
  setTimeout(function () { node.remove(); }, 2800);
}

var renameModal = document.getElementById('renameModal');
var renameForm = document.getElementById('renameForm');
var renameInput = document.getElementById('renameInput');
var renameError = document.getElementById('renameError');
var renameCancel = document.getElementById('renameCancel');
var renameSave = document.getElementById('renameSave');
var renameLectureId = null;

function setRenameError(message) {
  if (!renameError) return;
  renameError.textContent = message || '';
  renameError.classList.toggle('hidden', !message);
}

function closeRenameModal() {
  renameLectureId = null;
  setRenameError('');
  if (renameModal) renameModal.classList.add('hidden');
}

function openRenameModal(lectureId) {
  var title = lectureTitlesById[String(lectureId)];
  if (!renameModal || !renameInput || !title) return;
  renameLectureId = Number(lectureId);
  renameInput.value = title;
  setRenameError('');
  renameModal.classList.remove('hidden');
  setTimeout(function () { renameInput.focus(); renameInput.select(); }, 0);
}

if (renameCancel) renameCancel.addEventListener('click', closeRenameModal);
if (renameModal) renameModal.addEventListener('click', function (event) {
  if (event.target === renameModal) closeRenameModal();
});
if (renameForm) renameForm.addEventListener('submit', function (event) {
  event.preventDefault();
  var title = (renameInput && renameInput.value || '').trim();
  if (!renameLectureId || !title) {
    setRenameError('请输入课堂名称');
    return;
  }
  renameSave.disabled = true;
  renameSave.textContent = '保存中…';
  setRenameError('');
  fetch('/api/lectures/' + renameLectureId + '/rename', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
    body: JSON.stringify({ title: title })
  }).then(function (response) {
    return response.json().catch(function () { return {}; }).then(function (data) {
      if (!response.ok) throw new Error(data.detail || '修改名称失败');
      return data;
    });
  }).then(function () {
    closeRenameModal();
    historyToast('课堂名称已修改');
    loadPage(currentPage, currentSearch, currentDateFrom, currentDateTo);
  }).catch(function (error) {
    setRenameError(error.message || '修改名称失败');
  }).finally(function () {
    renameSave.disabled = false;
    renameSave.textContent = '保存';
  });
});

function downloadAuthorized(url, fallbackName, button) {
  var original = button ? button.innerHTML : '';
  if (button) {
    button.disabled = true;
    button.textContent = '准备中…';
  }
  return fetch(url, { headers: { 'Authorization': 'Bearer ' + TOKEN } })
    .then(function (response) {
      if (!response.ok) {
        return response.json().catch(function () { return {}; }).then(function (data) {
          var detail = data.detail;
          if (Array.isArray(detail)) detail = detail.map(function (item) { return item.msg || item; }).join('; ');
          throw new Error(detail || ('下载失败 (' + response.status + ')'));
        });
      }
      var disposition = response.headers.get('Content-Disposition') || '';
      var match = /filename\*=UTF-8''([^;]+)|filename=\"?([^\";]+)\"?/i.exec(disposition);
      var filename = fallbackName;
      if (match) {
        try { filename = decodeURIComponent(match[1] || match[2]); } catch (e) { filename = match[1] || match[2] || fallbackName; }
      }
      return response.blob().then(function (blob) { return { blob: blob, filename: filename }; });
    })
    .then(function (payload) {
      var objectUrl = URL.createObjectURL(payload.blob);
      var link = document.createElement('a');
      link.href = objectUrl;
      link.download = payload.filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 1000);
      historyToast('已开始下载');
    })
    .catch(function (err) {
      historyToast(err.message || '下载失败');
    })
    .then(function () {
      if (button) {
        button.disabled = false;
        button.innerHTML = original;
      }
    });
}

function exportBriefing(lectureId, button) {
  downloadAuthorized('/api/lectures/' + lectureId + '/briefing/export?format=md', '简报.md', button);
}

function appendRecording(lectureId) {
  if (!lectureId) return;
  window.location.href = 'recorder.html?append=' + encodeURIComponent(lectureId);
}

function downloadMaterials(lectureId, button) {
  downloadAuthorized('/api/lectures/' + lectureId + '/materials/export', '资料包.zip', button);
}

function uploadHistoryMaterial(lectureId, file, input) {
  if (!file) return;
  var form = new FormData();
  form.append('file', file);
  form.append('category', 'material');
  form.append('title', file.name || '学习资料');
  form.append('create_item', 'false');
  historyToast('正在上传…');
  fetch('/api/lectures/' + lectureId + '/attachments', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + TOKEN },
    body: form
  }).then(function (response) {
    return response.json().catch(function () { return {}; }).then(function (data) {
      if (!response.ok) {
        var detail = data.detail;
        if (Array.isArray(detail)) detail = detail.map(function (item) { return item.msg || item; }).join('; ');
        throw new Error(detail || '上传失败');
      }
      return data;
    });
  }).then(function () {
    historyToast('资料已上传');
  }).catch(function (err) {
    historyToast(err.message || '上传失败');
  }).then(function () {
    if (input) input.value = '';
  });
}

function bindHistoryMaterialActions() {
  document.querySelectorAll('.js-history-upload').forEach(function (input) {
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      var lectureId = Number(input.getAttribute('data-id'));
      if (!file || !lectureId) return;
      uploadHistoryMaterial(lectureId, file, input);
    });
  });
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str || ''));
  return div.innerHTML;
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  var escaped = escapeHtml(text);
  var q = escapeHtml(query);
  // 对已转义的文本做不区分大小写的匹配高亮
  var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escaped.replace(re, '<mark class="bg-yellow-200 rounded px-0.5">$1</mark>');
}

function goPage(p) { loadPage(p, currentSearch, currentDateFrom, currentDateTo); }

function loadPage(p, search, dateFrom, dateTo) {
  el.innerHTML = '<div class="text-center py-12 text-on-surface-variant">加载中...</div>';
  var url = '/api/lectures?page='+p+'&size=15';
  if (search) url += '&search=' + encodeURIComponent(search);
  if (dateFrom) url += '&date_from=' + encodeURIComponent(dateFrom);
  if (dateTo) url += '&date_to=' + encodeURIComponent(dateTo);
  if (currentCourseFilter === 'unassigned') url += '&unassigned=true';
  else if (currentCourseFilter) url += '&course_id=' + encodeURIComponent(currentCourseFilter);
  fetch(url, { headers: { 'Authorization': 'Bearer ' + TOKEN } })
    .then(function(r) { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(renderCards)
    .catch(function() { el.innerHTML = '<div class="text-center py-12 text-error">加载失败 <button onclick="location.reload()" class="text-primary underline ml-2">重试</button></div>'; });
}

// ─── 搜索（防抖 350ms）──────────────────────────
if (searchEl) {
  searchEl.addEventListener('input', function () {
    var q = this.value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      currentSearch = q;
      currentPage = 1;
      loadPage(1, q);
    }, 350);
  });

  // 清空按钮：在输入框右侧加一个 X
  searchEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { this.value = ''; clearSearch(); }
  });
}

function clearSearch() {
  if (searchEl) searchEl.value = '';
  currentSearch = '';
  currentPage = 1;
  loadPage(1, '');
}

// ─── 删除 ──────────────────────────────────────
function del(id) {
  if (confirm('确认删除该课堂记录？\n相关的转录和收藏也会被删除。')) {
    fetch('/api/lectures/' + id, {
      method: 'DELETE', headers: { 'Authorization': 'Bearer ' + TOKEN }
    }).then(function(r) { if (r.ok) loadPage(currentPage, currentSearch); else alert('删除失败'); });
  }
}

// ─── 日期筛选 ──────────────────────────────────
function applyDateFilter() {
  currentDateFrom = dateFromEl ? dateFromEl.value : '';
  currentDateTo = dateToEl ? dateToEl.value : '';
  currentPage = 1;
  if (dateClearEl) {
    dateClearEl.style.display = (currentDateFrom || currentDateTo) ? '' : 'none';
  }
  loadPage(1, currentSearch, currentDateFrom, currentDateTo);
}

if (dateFromEl) dateFromEl.addEventListener('change', applyDateFilter);
if (dateToEl) dateToEl.addEventListener('change', applyDateFilter);
if (dateClearEl) {
  dateClearEl.addEventListener('click', function () {
    if (dateFromEl) dateFromEl.value = '';
    if (dateToEl) dateToEl.value = '';
    applyDateFilter();
  });
}

function loadCourseFilters() {
  if (!TOKEN || !courseFilterEl) return;
  fetch('/api/courses?include_inactive=true', { headers: { 'Authorization': 'Bearer ' + TOKEN } })
    .then(function (response) { return response.ok ? response.json() : []; })
    .then(function (courses) {
      (courses || []).forEach(function (course) {
        var option = document.createElement('option');
        option.value = course.id;
        option.textContent = course.name + (course.term ? ' · ' + course.term : '') + (course.is_active ? '' : '（已归档）');
        courseFilterEl.appendChild(option);
      });
    });
}

if (courseFilterEl) {
  courseFilterEl.addEventListener('change', function () {
    currentCourseFilter = this.value;
    currentPage = 1;
    loadPage(1, currentSearch, currentDateFrom, currentDateTo);
  });
}

// ─── 多选删除 ──────────────────────────────────
var selectedIds = [];

function updateBatchBar() {
  var bar = document.getElementById('batch-bar');
  var countEl = document.getElementById('selected-count');
  if (!bar || !countEl) return;
  if (selectedIds.length > 0) {
    bar.classList.remove('hidden');
    countEl.textContent = '已选 ' + selectedIds.length + ' 项';
  } else {
    bar.classList.add('hidden');
  }
}

// 全选/取消全选
var selectAllEl = document.getElementById('select-all');
if (selectAllEl) {
  selectAllEl.addEventListener('change', function () {
    var checked = this.checked;
    var boxes = document.querySelectorAll('.lecture-checkbox');
    selectedIds = [];
    boxes.forEach(function (cb) {
      cb.checked = checked;
      if (checked) {
        var id = parseInt(cb.getAttribute('data-id'));
        if (id) selectedIds.push(id);
      }
    });
    updateBatchBar();
  });
}

// 监听列表变化，更新复选框事件
function refreshCheckboxListeners() {
  var boxes = document.querySelectorAll('.lecture-checkbox');
  boxes.forEach(function (cb) {
    if (cb._listenerAdded) return;
    cb._listenerAdded = true;
    cb.addEventListener('change', function () {
      var id = parseInt(this.getAttribute('data-id'));
      if (this.checked) {
        if (selectedIds.indexOf(id) === -1) selectedIds.push(id);
      } else {
        selectedIds = selectedIds.filter(function (x) { return x !== id; });
        if (selectAllEl) selectAllEl.checked = false;
      }
      updateBatchBar();
    });
  });
  // 清除已不在列表中的 ID
  var currentIds = [];
  boxes.forEach(function (cb) { currentIds.push(parseInt(cb.getAttribute('data-id'))); });
  selectedIds = selectedIds.filter(function (id) { return currentIds.indexOf(id) !== -1; });
  updateBatchBar();
}

// 批量删除 — 页面内确认弹窗
var deleteModal = document.getElementById('deleteModal');
var deleteModalMsg = document.getElementById('deleteModalMsg');
var deleteCancel = document.getElementById('deleteCancel');
var deleteConfirmBtn = document.getElementById('deleteConfirm');

function showDeleteModal(count) {
  if (!deleteModal) return;
  deleteModalMsg.textContent = '确认删除选中的 ' + count + ' 条记录？相关的转录和收藏也会被删除。';
  deleteModal.classList.remove('hidden');
}

function hideDeleteModal() {
  if (deleteModal) deleteModal.classList.add('hidden');
}

if (deleteCancel) deleteCancel.addEventListener('click', hideDeleteModal);
if (deleteModal) {
  deleteModal.addEventListener('click', function (e) {
    if (e.target === deleteModal) hideDeleteModal();
  });
}

var batchDeleteBtn = document.getElementById('batch-delete');
if (batchDeleteBtn) {
  batchDeleteBtn.addEventListener('click', function () {
    if (!selectedIds.length) return;
    showDeleteModal(selectedIds.length);
  });
}

if (deleteConfirmBtn) {
  deleteConfirmBtn.addEventListener('click', function () {
    hideDeleteModal();
    var ids = selectedIds.slice();
    fetch('/api/lectures/batch-delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
      body: JSON.stringify({ ids: ids })
    }).then(function (response) {
      if (!response.ok) throw new Error('批量删除失败');
      return response.json();
    }).then(function (result) {
      toastMsg(result.message || ('已删除 ' + ids.length + ' 条记录'));
      selectedIds = [];
      if (selectAllEl) selectAllEl.checked = false;
      updateBatchBar();
      loadPage(currentPage, currentSearch, currentDateFrom, currentDateTo);
    }).catch(function () { toastMsg('部分删除失败'); });
  });
}

// toast
function toastMsg(msg) {
  var t = document.createElement('div');
  t.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full text-sm shadow-lg z-[100]';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 2500);
}

// 每次渲染后刷新复选框事件
var origRenderCards = renderCards;
renderCards = function (result) {
  selectedIds = [];
  if (selectAllEl) selectAllEl.checked = false;
  updateBatchBar();
  origRenderCards(result);
  setTimeout(refreshCheckboxListeners, 50);
};

// ─── 初始化 ────────────────────────────────────
if (!TOKEN) {
  el.innerHTML = '<div class="text-center py-16"><span class="material-symbols-outlined text-5xl text-outline/30 mb-4 block">lock</span><p class="text-on-surface-variant">请先<a href="login.html" class="text-primary font-bold">登录</a></p></div>';
} else {
  loadCourseFilters();
  loadPage(1, '');
}

// ─── 菜单关闭 ──────────────────────────────────
document.addEventListener('click', function(e) {
  var m = document.getElementById('navMenu');
  if (m && !m.classList.contains('hidden') && !e.target.closest('#navMenu') && !e.target.closest('button[onclick*="navMenu"]')) {
    m.classList.add('hidden');
  }
});
</script>
