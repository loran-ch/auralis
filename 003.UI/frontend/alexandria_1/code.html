<body class="text-on-surface antialiased overflow-x-hidden">
<!-- Top Navigation Bar -->
<nav class="fixed top-0 w-full z-50 glass-nav flex justify-between items-center px-6 h-16 border-b border-outline-variant/15">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant" onclick="window.location.href='{{DATA:SCREEN:SCREEN_30}}'">

</button>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">flash_on</span>
<span class="serif-headline font-bold text-xl tracking-tight text-primary">LiveTrans</span>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->

<!-- Main Content Canvas -->
<main class="min-h-screen pt-24 pb-12 flex flex-col items-center justify-center px-6">
<div class="w-full max-w-md space-y-10">
<!-- Header Section -->
<header class="text-center space-y-4">

<div class="w-12 h-12 rounded-full overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A macro studio shot of an elegant crystal prism catching light, dispersing it into a subtle rainbow spectrum. The background is a soft, high-key white, reflecting a premium editorial aesthetic. The lighting is clean and cinematic, emphasizing transparency and technological precision, perfectly matching the LiveTrans brand identity of clarity and speed." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB0J2PQJ9jMCJruWszOFKm6Lrf_44fowbEwwdex7o_K-ECB_Hn8erdeie3jo5FNYUn0OyxabSIU44Bx9xV3IPRGmkSgPEsPhTqpozPhTg9emIRRl9DhXZjJwDmGmoY-mJnTU87p3yhOQitBWn_D2kWFYueJCU671tpHOtHBkW55sm8mdeH_FHqHk6QcAVmRHZHoOJzMJazFw6qzyt8ks4eFa8C7nqBrNo1agYu3krPlk8LCxL_G4eDhv0LKlH5OBKzj8yae1rFm4w">
</div>
</div>
<h1 class="serif-headline text-4xl font-bold tracking-tight text-on-surface">创建账号</h1>
<p class="text-on-surface-variant font-body text-sm">开启您的即时全球对话之旅</p>
</header>
<!-- Registration Form -->
<form class="space-y-6">
<!-- Username/Email -->
<div class="group">
<label class="label-font text-xs font-semibold text-outline tracking-widest uppercase mb-2 block">用户名/邮箱</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl">alternate_email</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-xl py-4 pl-12 pr-4 text-on-surface font-body transition-all" placeholder="name@example.com" type="text">
</div>
</div>
<!-- Password -->
<div class="group">
<label class="label-font text-xs font-semibold text-outline tracking-widest uppercase mb-2 block">设置密码</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-xl py-4 pl-12 pr-12 text-on-surface font-body transition-all" placeholder="••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="group">
<label class="label-font text-xs font-semibold text-outline tracking-widest uppercase mb-2 block">确认密码</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl">verified_user</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-xl py-4 pl-12 pr-4 text-on-surface font-body transition-all" placeholder="••••••••" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full gradient-btn text-white font-bold py-4 rounded-xl shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit" onclick="event.preventDefault(); window.location.href='{{DATA:SCREEN:SCREEN_27}}'">
<span class="">立即注册</span>
<span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Bottom Link -->
<div class="text-center pt-4">
<p class="font-body text-on-surface-variant">
                    已有账号？ 
                    <a class="text-primary font-semibold hover:underline underline-offset-4 decoration-2" href="javascript:void(0)" onclick="window.location.href='{{DATA:SCREEN:SCREEN_30}}'">立即登录</a>
</p>
</div>
</div>
<!-- Decorative Background Element (Subtle Glass) -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[100px] -z-10 pointer-events-none"></div>

<footer class="mt-auto pt-16 pb-8 text-center">
<p class="label-font text-[10px] text-outline tracking-[0.2em] font-semibold">SECURE AUTH V1.01</p>
</footer>
</main>
<!-- Subtle Micro-interaction Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.querySelector('label').style.color = '#094cb2';
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.querySelector('label').style.color = '#737784';
            });
        });

        // Toggle Password Visibility Logic
        const visibilityBtn = document.querySelector('button .material-symbols-outlined[textContent="visibility"]');
        if (visibilityBtn) {
            visibilityBtn.parentElement.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                const icon = this.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                }
            });
        }
    </script>
