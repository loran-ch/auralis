<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LiveTrans - 个人中心</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Inter:wght@400;500;600&family=Public+Sans:wght@600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="../js/shared-config.js"></script>
</head>
<body class="bg-background text-on-background min-h-screen pb-32">

<!-- Top App Bar -->
<header class="top-appbar">
  <div class="flex items-center gap-3">
    <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors" onclick="document.getElementById('navDrawer').classList.toggle('open')">
      <span class="material-symbols-outlined text-primary text-2xl">flash_on</span>
    </button>
    <h1 class="text-xl font-bold text-primary tracking-tight">LiveTrans</h1>
  </div>
  <a href="edit-profile.html" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-container transition-colors">
    <span class="material-symbols-outlined text-on-surface">edit</span>
  </a>
</header>

<main class="pt-24 px-6 space-y-8">
  <!-- 用户信息 -->
  <section class="flex flex-col items-center py-4">
    <div class="relative">
      <div class="w-28 h-28 rounded-full border border-outline-variant p-1.5 bg-white shadow-sm">
        <img alt="Profile" class="w-full h-full rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDXPBtcffESDDhqlMr93h_iyVU9Hgu-k3Z0_jLIJYzH4xQFMHz9e-hkxqbDY3R99FT6bHlk-gpjDvE77ZmAWN0vDRt8ojEoauWEACK4VLeiXTXEAb7SAgnQ03Rd8NUFnnTu3-OATAVciNAjkw2aXDn7SqwvuFlY0q9d3ESqK5bUFIMlgYUW5cETh4cgM3759gHttGPQxbfITf4NC9PxpswD_QZITyct3Aj-1LjX0M-5FQTJwbs41KuVAiWQwz-nAXYBxoUdF9WWoQ">
      </div>
      <div class="absolute -bottom-1 -right-1 bg-primary text-on-primary px-3 py-1 rounded-full text-[10px] font-bold tracking-widest uppercase shadow-md">Pro</div>
    </div>
    <div class="mt-6 text-center">
      <h2 class="text-2xl font-bold text-on-surface">旅行者_01</h2>
      <p class="mt-1 label-text text-sm text-secondary flex items-center justify-center gap-1.5">
        <span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings:'FILL'1;">verified</span>
        2024年起专业会员
      </p>
    </div>
  </section>

  <!-- 云同步 + 数据 -->
  <section class="grid grid-cols-2 gap-4">
    <div class="col-span-2 glass-panel p-5 rounded-xl flex items-center justify-between">
      <div>
        <h3 class="text-sm font-semibold text-on-surface">云端同步</h3>
        <p class="text-xs text-secondary mt-0.5">上次同步：2分钟前</p>
      </div>
      <label class="relative inline-flex items-center cursor-pointer">
        <input checked type="checkbox" class="sr-only peer">
        <div class="w-11 h-6 bg-surface-container-highest rounded-full peer peer-checked:bg-primary peer-focus:outline-none after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
      </label>
    </div>
    <a href="history.html" class="glass-panel p-5 rounded-xl space-y-2 active:scale-[0.98] transition-transform">
      <span class="material-symbols-outlined text-primary">history</span>
      <div>
        <p class="text-[10px] font-bold text-secondary uppercase tracking-widest">历史</p>
        <p class="text-2xl font-bold text-on-surface mt-1">128</p>
      </div>
    </a>
    <div class="glass-panel p-5 rounded-xl space-y-2">
      <span class="material-symbols-outlined text-tertiary" style="font-variation-settings:'FILL'1;">star</span>
      <div>
        <p class="text-[10px] font-bold text-secondary uppercase tracking-widest">收藏</p>
        <p class="text-2xl font-bold text-on-surface mt-1">15</p>
      </div>
    </div>
  </section>

  <!-- 离线包 -->
  <section class="glass-panel p-5 rounded-xl flex items-center gap-5">
    <div class="w-12 h-12 rounded-lg bg-primary/5 flex items-center justify-center text-primary border border-primary/10">
      <span class="material-symbols-outlined">download</span>
    </div>
    <div class="flex-1">
      <h3 class="text-sm font-semibold text-on-surface">离线包</h3>
      <div class="w-full bg-surface-container-highest rounded-full h-1 mt-3 overflow-hidden">
        <div class="bg-primary h-full rounded-full" style="width:75%"></div>
      </div>
    </div>
    <p class="text-2xl font-bold text-on-surface">3</p>
  </section>

  <!-- 设置菜单 -->
  <section class="space-y-3">
    <h4 class="text-[11px] font-bold text-secondary px-1 uppercase tracking-[0.2em]">设置与偏好</h4>
    <div class="glass-panel rounded-xl overflow-hidden divide-y divide-outline-variant/10">
      <button class="w-full flex items-center gap-4 px-5 py-4 hover:bg-surface-container-low transition-colors group" onclick="LiveTrans.go('language')">
        <span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">translate</span>
        <span class="flex-1 text-left text-[15px] font-medium text-on-surface">语言设置</span>
        <span class="material-symbols-outlined text-outline-variant text-[18px]">chevron_right</span>
      </button>
      <button class="w-full flex items-center gap-4 px-5 py-4 hover:bg-surface-container-low transition-colors group" onclick="LiveTrans.go('settings')">
        <span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">settings</span>
        <span class="flex-1 text-left text-[15px] font-medium text-on-surface">翻译引擎设置</span>
        <span class="material-symbols-outlined text-outline-variant text-[18px]">chevron_right</span>
      </button>
      <button class="w-full flex items-center gap-4 px-5 py-4 hover:bg-surface-container-low transition-colors group">
        <span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">lock</span>
        <span class="flex-1 text-left text-[15px] font-medium text-on-surface">账户安全</span>
        <span class="material-symbols-outlined text-outline-variant text-[18px]">chevron_right</span>
      </button>
      <button class="w-full flex items-center gap-4 px-5 py-4 hover:bg-surface-container-low transition-colors group">
        <span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">help</span>
        <span class="flex-1 text-left text-[15px] font-medium text-on-surface">帮助与反馈</span>
        <span class="material-symbols-outlined text-outline-variant text-[18px]">chevron_right</span>
      </button>
      <button class="w-full flex items-center gap-4 px-5 py-4 hover:bg-surface-container-low transition-colors group">
        <span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">shield</span>
        <span class="flex-1 text-left text-[15px] font-medium text-on-surface">隐私设置</span>
        <span class="material-symbols-outlined text-outline-variant text-[18px]">chevron_right</span>
      </button>
    </div>
  </section>

  <!-- 退出登录 -->
  <a href="login.html" class="w-full py-4 rounded-xl border border-error/20 text-error font-semibold text-sm flex items-center justify-center gap-2 hover:bg-error/5 active:scale-[0.98] transition-all">
    <span class="material-symbols-outlined text-[20px]">logout</span>退出登录
  </a>
</main>

<!-- 底部导航 -->
<nav class="bottom-nav">
  <a href="viewfinder.html" class="text-secondary hover:text-primary">
    <span class="material-symbols-outlined text-[26px]">photo_camera</span>
    <span class="nav-label">翻译</span>
  </a>
  <a href="history.html" class="text-secondary hover:text-primary">
    <span class="material-symbols-outlined text-[26px]">history</span>
    <span class="nav-label">历史</span>
  </a>
  <a href="profile.html" class="text-primary">
    <span class="material-symbols-outlined text-[26px]" style="font-variation-settings:'FILL'1;">person</span>
    <span class="nav-label">我的</span>
  </a>
</nav>

<!-- 侧边抽屉 -->
<div class="nav-drawer" id="navDrawer">
  <div class="px-8 mb-8 flex flex-col items-start">
    <div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center mb-5">
      <span class="material-symbols-outlined text-primary text-3xl">person</span>
    </div>
    <h3 class="text-xl font-bold text-on-surface">旅行者_01</h3>
    <p class="text-sm text-secondary mt-1">专业会员</p>
    <p class="text-[10px] font-bold uppercase tracking-widest text-brand-green/70 mt-2">2分钟前同步</p>
  </div>
  <div class="flex-1 space-y-1 px-4">
    <a href="history.html" class="flex items-center gap-4 py-4 px-6 rounded-xl text-on-surface hover:bg-surface-container transition-colors">
      <span class="material-symbols-outlined text-outline">history</span><span class="font-medium">翻译历史</span>
    </a>
    <button class="w-full flex items-center gap-4 py-4 px-6 rounded-xl text-on-surface hover:bg-surface-container transition-colors" onclick="LiveTrans.go('language')">
      <span class="material-symbols-outlined text-outline">translate</span><span class="font-medium">语言设置</span>
    </button>
    <button class="w-full flex items-center gap-4 py-4 px-6 rounded-xl bg-primary-container text-on-primary font-bold shadow-md">
      <span class="material-symbols-outlined">settings</span><span>引擎设置</span>
    </button>
    <a href="login.html" class="flex items-center gap-4 py-4 px-6 rounded-xl text-error hover:bg-error/5 transition-colors mt-8">
      <span class="material-symbols-outlined text-error">logout</span><span class="font-medium">退出登录</span>
    </a>
  </div>
</div>

<script>
  document.addEventListener('click', (e) => {
    const drawer = document.getElementById('navDrawer');
    if (drawer.classList.contains('open') && !drawer.contains(e.target) && !e.target.closest('[onclick*="navDrawer"]')) {
      drawer.classList.remove('open');
    }
  });
</script>
</body>
</html>
