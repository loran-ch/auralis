<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LiveTrans - 创建账号</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Inter:wght@400;500;600&family=Public+Sans:wght@600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="../js/shared-config.js"></script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col">

<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-8 py-16 max-w-lg mx-auto">
  <header class="mb-12 flex flex-col items-center">
    <div class="mb-6 flex items-center justify-center">
      <span class="material-symbols-outlined text-[40px] text-primary-container">person_add</span>
    </div>
    <h1 class="font-display text-3xl font-bold tracking-tight text-on-surface">创建账号</h1>
    <p class="font-body text-sm text-secondary mt-3">注册后可云端同步翻译记录</p>
  </header>

  <!-- 手机号注册 -->
  <div class="w-full space-y-6">
    <div class="space-y-3">
      <label class="font-label text-xs uppercase tracking-wider text-secondary">手机号</label>
      <div class="flex items-center gap-3">
        <input class="flex-1 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary text-on-surface font-body py-3 px-4 placeholder:text-outline/50" placeholder="请输入手机号" type="tel">
        <button class="px-4 py-3 bg-surface-container-high rounded-lg font-label text-xs uppercase tracking-wider text-primary hover:bg-primary hover:text-white transition-all duration-200 whitespace-nowrap">获取验证码</button>
      </div>
    </div>
    <div class="space-y-3">
      <label class="font-label text-xs uppercase tracking-wider text-secondary">验证码</label>
      <input class="w-full bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary text-on-surface font-body py-3 px-4 placeholder:text-outline/50" placeholder="请输入6位验证码" type="text" maxlength="6">
    </div>

    <button class="w-full py-4 bg-primary-container text-on-primary rounded-lg font-display text-base font-medium shadow-sm hover:bg-primary transition-all duration-300" onclick="LiveTrans.go('viewfinder')">
      注册并登录
    </button>

    <!-- 分隔 -->
    <div class="flex items-center gap-4 py-2">
      <div class="flex-1 h-px bg-outline-variant/30"></div>
      <span class="font-label text-[11px] text-outline uppercase tracking-widest">或</span>
      <div class="flex-1 h-px bg-outline-variant/30"></div>
    </div>

    <!-- 第三方注册 -->
    <div class="flex justify-center gap-4">
      <button class="w-14 h-14 rounded-xl border border-outline-variant flex items-center justify-center text-2xl hover:border-primary hover:shadow-md transition-all" title="微信注册">💬</button>
      <button class="w-14 h-14 rounded-xl border border-outline-variant flex items-center justify-center text-2xl hover:border-primary hover:shadow-md transition-all" title="Apple 注册">🍎</button>
      <button class="w-14 h-14 rounded-xl border border-outline-variant flex items-center justify-center text-2xl hover:border-primary hover:shadow-md transition-all" title="Google 注册">🔵</button>
    </div>

    <p class="text-center font-body text-sm text-secondary pt-4">
      已有账号？ <a class="text-primary-container font-medium cursor-pointer hover:underline" href="login.html">立即登录</a>
    </p>
  </div>
</main>

<footer class="pb-8 flex flex-col items-center">
  <div class="flex items-center gap-3 font-label text-[10px] tracking-[0.2em] text-outline/60 uppercase">
    <span class="w-1 h-1 rounded-full bg-primary-container/40"></span>
    注册即同意服务协议和隐私政策
  </div>
</footer>

</body>
</html>
