<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LiveTrans - 编辑资料</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Inter:wght@400;500;600&family=Public+Sans:wght@600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="../js/shared-config.js"></script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen">

<main class="max-w-lg mx-auto px-6 py-16">
  <div class="flex items-center gap-4 mb-12">
    <a href="profile.html" class="p-2 -ml-2 text-primary active:opacity-70 transition-opacity">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <h1 class="font-display text-2xl font-bold text-on-surface">编辑个人资料</h1>
  </div>

  <!-- 头像 -->
  <div class="flex flex-col items-center mb-12">
    <div class="relative">
      <div class="w-24 h-24 rounded-full bg-primary/10 flex items-center justify-center shadow-sm border border-outline-variant">
        <span class="material-symbols-outlined text-primary text-4xl">person</span>
      </div>
      <button class="absolute -bottom-1 -right-1 bg-primary text-on-primary w-8 h-8 rounded-full flex items-center justify-center shadow-md">
        <span class="material-symbols-outlined text-sm">photo_camera</span>
      </button>
    </div>
    <p class="text-sm text-secondary mt-3">点击更换头像</p>
  </div>

  <!-- 表单 -->
  <div class="space-y-8">
    <div class="space-y-2">
      <label class="label-text text-xs uppercase tracking-wider text-secondary">昵称</label>
      <div class="curator-border focus-within:border-primary-container transition-all duration-300">
        <input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body py-3 px-0" value="旅行者_01" type="text">
      </div>
    </div>
    <div class="space-y-2">
      <label class="label-text text-xs uppercase tracking-wider text-secondary">邮箱</label>
      <div class="curator-border focus-within:border-primary-container transition-all duration-300">
        <input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body py-3 px-0" value="user@livetrans.app" type="email">
      </div>
    </div>
    <div class="space-y-2">
      <label class="label-text text-xs uppercase tracking-wider text-secondary">绑定手机</label>
      <div class="curator-border focus-within:border-primary-container transition-all duration-300">
        <input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body py-3 px-0" value="+86 138****8888" type="tel" disabled>
      </div>
      <p class="text-[11px] text-outline">手机号用于账号安全，如更换需验证</p>
    </div>

    <button class="w-full py-4 bg-primary text-on-primary rounded-lg font-display text-base font-medium shadow-sm hover:bg-primary-dark transition-all duration-300" onclick="LiveTrans.go('profile')">
      保存修改
    </button>
  </div>
</main>

</body>
</html>
