<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LiveTrans - 实时翻译取景器</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Inter:wght@400;500;600&family=Public+Sans:wght@600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="../js/shared-config.js"></script>
  <style>
    body { overflow: hidden; height: 100vh; }
    .camera-bg { background: linear-gradient(180deg, #e8ecf1 0%, #dfe4ea 50%, #e8ecf1 100%); }
  </style>
</head>
<body class="bg-background text-on-background font-body overflow-hidden h-screen select-none">

<!-- 模拟取景器背景 -->
<div class="fixed inset-0 z-0 camera-bg"></div>

<!-- Top AppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-14 bg-white/70 backdrop-blur-md border-b border-outline-variant/30">
  <div class="flex items-center gap-1">
    <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-black/5 transition-all" onclick="document.getElementById('navDrawer').classList.toggle('open')">
      <span class="material-symbols-outlined text-primary text-2xl">flash_on</span>
    </button>
  </div>
  <div class="flex items-center gap-2 bg-white/50 px-4 py-1.5 rounded-full border border-outline-variant/30 cursor-pointer" onclick="LiveTrans.go('settings')">
    <span class="label-text text-[10px] text-on-surface-variant uppercase tracking-widest">引擎</span>
    <span class="label-text text-sm text-primary font-semibold">默认引擎</span>
    <span class="material-symbols-outlined text-sm text-primary">expand_more</span>
  </div>
  <div class="flex items-center gap-1">
    <a class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-black/5 transition-all" href="profile.html">
      <span class="material-symbols-outlined text-primary text-2xl">account_circle</span>
    </a>
  </div>
</header>

<!-- 同步 Toast -->
<div class="fixed top-[4.5rem] right-4 z-[55] glass-panel px-3 py-1.5 rounded-full flex items-center gap-2 shadow-sm" id="syncToast">
  <span class="material-symbols-outlined text-brand-green text-[16px]" style="font-variation-settings:'FILL'1;">check_circle</span>
  <span class="label-text text-[11px] text-on-surface uppercase tracking-wider">已同步</span>
</div>

<!-- 翻译区域 -->
<main class="relative h-full w-full flex items-center justify-center pt-14 pb-48 px-4 z-10">
  <div class="relative w-full max-w-md flex flex-col items-center">
    <!-- 检测框 -->
    <div class="relative">
      <div class="w-52 h-14 border-2 border-brand-green rounded-lg breathing-border flex items-center justify-center shadow-sm">
        <span class="font-headline text-xl text-on-surface">Escargots</span>
      </div>
      <!-- 连接线 -->
      <div class="absolute left-1/2 -bottom-4 w-px h-4 bg-brand-green"></div>
      <!-- 译文卡片 -->
      <div class="absolute left-1/2 -translate-x-1/2 top-[calc(100%+20px)] w-max min-w-[230px] glass-panel p-5 rounded-xl shadow-[0_8px_30px_rgba(0,0,0,0.08)]">
        <div class="flex flex-col gap-1">
          <div class="flex items-center justify-between mb-1.5">
            <span class="label-text text-[11px] text-brand-green/70 uppercase tracking-widest">已检测 · 法语</span>
            <span class="material-symbols-outlined text-sm text-on-surface-variant hover:text-primary cursor-pointer transition-colors">volume_up</span>
          </div>
          <h2 class="font-headline text-2xl text-on-surface border-b border-brand-green/10 pb-2 mb-2">
            法式焗蜗牛
            <span class="text-lg opacity-70">(Escargots)</span>
          </h2>
          <p class="font-body text-sm text-on-surface-variant italic">法国经典前菜，以大蒜黄油焗烤</p>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- 语言栏 -->
<nav class="fixed left-1/2 -translate-x-1/2 z-40 w-[90%] max-w-sm bottom-[11rem]">
  <div class="glass-panel rounded-full px-6 py-3.5 flex items-center justify-between shadow-lg">
    <button class="flex items-center gap-2 text-primary font-label text-sm uppercase tracking-wide" onclick="LiveTrans.go('language')">
      法语
      <span class="material-symbols-outlined text-xs">expand_more</span>
    </button>
    <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center" onclick="LiveTrans.go('language')">
      <span class="material-symbols-outlined text-primary text-xl">swap_horiz</span>
    </div>
    <button class="flex items-center gap-2 text-primary font-label text-sm uppercase tracking-wide" onclick="LiveTrans.go('language')">
      简体中文
      <span class="material-symbols-outlined text-xs">expand_more</span>
    </button>
  </div>
</nav>

<!-- 底部操作栏 -->
<footer class="fixed w-full z-40 h-24 flex justify-around items-center px-4 bottom-0 bg-white/70 backdrop-blur-md pb-safe">
  <button class="flex flex-col items-center justify-center text-on-surface-variant p-3 hover:bg-black/5 rounded-full transition-all active:scale-95" id="freezeBtn">
    <span class="material-symbols-outlined text-2xl">ac_unit</span>
    <span class="label-text text-[10px] mt-1 uppercase tracking-wider">冻结</span>
  </button>
  <div class="relative flex items-center justify-center">
    <div class="absolute w-20 h-20 rounded-full border border-primary/20 animate-pulse"></div>
    <button class="relative w-16 h-16 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-xl shutter-glow transition-all active:scale-90 z-10" id="captureBtn">
      <span class="material-symbols-outlined text-3xl" style="font-variation-settings:'FILL'1;">photo_camera</span>
    </button>
  </div>
  <button class="flex flex-col items-center justify-center text-on-surface-variant p-3 hover:bg-black/5 rounded-full transition-all active:scale-95" onclick="LiveTrans.go('history')">
    <span class="material-symbols-outlined text-2xl">history</span>
    <span class="label-text text-[10px] mt-1 uppercase tracking-wider">历史</span>
  </button>
</footer>

<!-- 侧边抽屉 -->
<div class="nav-drawer" id="navDrawer">
  <div class="px-8 mb-8 flex flex-col items-start">
    <div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center mb-5">
      <span class="material-symbols-outlined text-primary text-3xl">person</span>
    </div>
    <h3 class="text-xl font-bold text-on-surface">旅行者_01</h3>
    <p class="text-sm text-secondary mt-1">专业会员</p>
    <p class="text-[10px] font-bold uppercase tracking-widest text-brand-green/70 mt-2">2分钟前同步</p>
  </div>
  <div class="flex-1 space-y-1 px-4">
    <a href="profile.html" class="flex items-center gap-4 py-4 px-6 rounded-xl text-on-surface hover:bg-surface-container transition-colors">
      <span class="material-symbols-outlined text-outline">person</span>
      <span class="font-medium">个人中心</span>
    </a>
    <a href="history.html" class="flex items-center gap-4 py-4 px-6 rounded-xl text-on-surface hover:bg-surface-container transition-colors">
      <span class="material-symbols-outlined text-outline">history</span>
      <span class="font-medium">翻译历史</span>
    </a>
    <button class="w-full flex items-center gap-4 py-4 px-6 rounded-xl text-on-surface hover:bg-surface-container transition-colors" onclick="LiveTrans.go('language')">
      <span class="material-symbols-outlined text-outline">translate</span>
      <span class="font-medium">语言设置</span>
    </button>
    <button class="w-full flex items-center gap-4 py-4 px-6 rounded-xl text-on-surface hover:bg-surface-container transition-colors" onclick="LiveTrans.go('settings')">
      <span class="material-symbols-outlined text-outline">settings</span>
      <span class="font-medium">引擎设置</span>
    </button>
    <a href="login.html" class="flex items-center gap-4 py-4 px-6 rounded-xl text-error hover:bg-error/5 transition-colors mt-8">
      <span class="material-symbols-outlined text-error">logout</span>
      <span class="font-medium">退出登录</span>
    </a>
  </div>
</div>

<script>
  // 拍照闪光
  document.getElementById('captureBtn').addEventListener('click', () => {
    const flash = document.createElement('div');
    flash.className = 'fixed inset-0 bg-white z-[100] pointer-events-none';
    flash.style.opacity = '0';
    document.body.appendChild(flash);
    flash.animate([{opacity:0.9},{opacity:0}], {duration:300,easing:'ease-out'}).onfinish = () => flash.remove();
  });

  // 冻结切换
  let frozen = false;
  const freezeBtn = document.getElementById('freezeBtn');
  freezeBtn.addEventListener('click', () => {
    frozen = !frozen;
    if (frozen) { freezeBtn.classList.add('text-brand-green'); freezeBtn.querySelector('span').style.fontVariationSettings = "'FILL' 1"; }
    else { freezeBtn.classList.remove('text-brand-green'); freezeBtn.querySelector('span').style.fontVariationSettings = "'FILL' 0"; }
  });

  // 点击空白处关闭抽屉
  document.addEventListener('click', (e) => {
    const drawer = document.getElementById('navDrawer');
    if (drawer.classList.contains('open') && !drawer.contains(e.target) && e.target.closest('[onclick]')?.getAttribute('onclick')?.includes('navDrawer') !== true) {
      drawer.classList.remove('open');
    }
  });
</script>
</body>
</html>
