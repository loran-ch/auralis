<!DOCTYPE html><html class="light" lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>LiveTrans Voice - 注册</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "primary": "#4A90D9",
                "on-primary": "#ffffff",
                "primary-container": "#D1E4F9",
                "on-primary-container": "#001D36",
                "secondary": "#535F70",
                "on-secondary": "#ffffff",
                "tertiary": "#6B5778",
                "on-tertiary": "#ffffff",
                "error": "#BA1A1A",
                "on-error": "#ffffff",
                "background": "#FAF9FA",
                "on-background": "#191C1E",
                "surface": "#FAF9FA",
                "on-surface": "#191C1E",
                "surface-variant": "#DFE2EB",
                "on-surface-variant": "#43474E",
                "outline": "#73777F",
                "surface-container-lowest": "#FFFFFF",
                "surface-container-low": "#F4F3F4",
                "surface-container": "#EEEDEF",
                "surface-container-high": "#E8E7E9",
                "surface-container-highest": "#E2E2E4"
            },
            "borderRadius": {
                "DEFAULT": "0.5rem",
                "lg": "1rem",
                "xl": "1.5rem",
                "full": "9999px"
            },
            "fontFamily": {
                "headline": ["Inter"],
                "display": ["Inter"],
                "body": ["Inter"],
                "label": ["Inter"]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .light-card {
            background: #ffffff;
            border: 1px solid #E2E2E4;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .custom-input {
            background: #F4F3F4;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .custom-input:focus-within {
            border-color: #4A90D9;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(74, 144, 217, 0.1);
        }

        body {
            background-color: #FAF9FA;
            color: #191C1E;
            overflow-x: hidden;
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="font-body selection:bg-primary/30 min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex items-center px-4 h-16 w-full z-50 sticky top-0 bg-surface/80 backdrop-blur-lg border-b border-surface-container-high">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-black/5 transition-colors active:scale-95 duration-200 text-on-surface" onclick="window.location.href='{{DATA:SCREEN:SCREEN_12}}'">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="ml-4 font-headline text-lg tracking-tight font-semibold text-on-surface">Lecture Notes</h1>
</header>
<main class="flex-grow flex items-center justify-center p-6 md:p-12">
<div class="w-full max-w-md space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Header Section -->
<div class="text-center space-y-2">
<h2 class="text-4xl font-extrabold tracking-tight text-on-surface">创建新账户</h2>
<p class="text-on-surface-variant font-medium">开启您的 AI 语音实时翻译之旅</p>
</div>
<!-- Form Section -->
<div class="light-card rounded-xl p-8 space-y-6">
<!-- Phone Number -->
<div class="space-y-2">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1">手机号</label>
<div class="custom-input flex items-center px-4 py-3.5 rounded-lg group">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors mr-3" data-icon="phone_iphone">phone_iphone</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-on-surface-variant/50" placeholder="请输入您的手机号码" type="tel">
</div>
</div>
<!-- Verification Code -->
<div class="space-y-2">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1">验证码</label>
<div class="flex gap-3">
<div class="custom-input flex items-center px-4 py-3.5 rounded-lg group flex-grow">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors mr-3" data-icon="shield_lock">shield_lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-on-surface-variant/50" placeholder="验证码" type="text">
</div>
<button class="px-6 py-3.5 rounded-lg bg-primary-container text-on-primary-container font-semibold hover:bg-primary/10 transition-all active:scale-95 duration-200 text-sm whitespace-nowrap">
                        发送
                    </button>
</div>
</div>
<!-- Set Password -->
<div class="space-y-2">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1">设置密码</label>
<div class="custom-input flex items-center px-4 py-3.5 rounded-lg group">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors mr-3" data-icon="lock">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-on-surface-variant/50" placeholder="6-16位数字与字母组合" type="password">
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Checkbox -->
<div class="flex items-start space-x-3 pt-2">
<div class="relative flex items-center justify-center mt-1">
<input class="peer h-5 w-5 rounded border-outline bg-surface-container text-primary focus:ring-primary/20 transition-all cursor-pointer" id="terms" type="checkbox">
<span class="material-symbols-outlined absolute text-[12px] text-on-primary opacity-0 peer-checked:opacity-100 pointer-events-none" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<label class="text-sm text-on-surface-variant leading-relaxed cursor-pointer select-none" for="terms">
                    我已阅读并同意 <a class="text-primary font-medium hover:underline transition-all" href="#">用户协议</a> 和 <a class="text-primary font-medium hover:underline transition-all" href="#">隐私政策</a>
</label>
</div>
<!-- Action Button -->
<button class="w-full py-4 rounded-xl bg-primary text-on-primary font-bold text-lg shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 hover:scale-[1.01] active:scale-95 transition-all duration-300 mt-4 relative overflow-hidden group" onclick="window.location.href='{{DATA:SCREEN:SCREEN_19}}'">
<span class="relative z-10">注册并登录</span>
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
</button>
</div>
<!-- Footer Meta -->
<div class="text-center text-on-surface-variant text-sm">
            已有账户？ <a class="text-primary font-semibold hover:underline transition-colors" href="{{DATA:SCREEN:SCREEN_14}}">立即登录</a>
</div>
</div>
</main>
<!-- App Bottom Indicator (Visual only) -->
<div class="h-1.5 w-32 bg-on-surface/10 rounded-full mx-auto mb-2"></div>
<!-- Script for interaction logic -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Password toggle logic
        const togglePass = document.querySelector('button .material-symbols-outlined[data-icon="visibility"]');
        const passInput = document.querySelector('input[type="password"]');
        
        if (togglePass && passInput) {
            togglePass.parentElement.addEventListener('click', () => {
                const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passInput.setAttribute('type', type);
                togglePass.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        }
    });
</script>










</body></html>
