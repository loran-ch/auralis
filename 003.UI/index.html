<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LiveTrans - 登录</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Inter:wght@400;500;600&family=Public+Sans:wght@600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="js/shared-config.js"></script>
  <style>
    body { background-color: #faf9fa; }
  </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed">

<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-8 py-16 max-w-lg mx-auto min-h-screen">
  <header class="mb-16 flex flex-col items-center">
    <div class="mb-8 flex items-center justify-center">
      <span class="material-symbols-outlined text-[48px] text-primary-container">flash_on</span>
    </div>
    <h1 class="font-display text-4xl font-bold tracking-tight text-on-surface">LiveTrans</h1>
    <div class="mt-4 w-12 h-px bg-primary-container/30"></div>
    <p class="font-body text-sm uppercase tracking-[0.2em] text-secondary mt-6">Reality, Translated.</p>
  </header>

  <div class="w-full space-y-12">
    <div class="space-y-8">
      <div class="space-y-8">
        <div class="space-y-3">
          <label class="font-label text-xs uppercase tracking-wider text-secondary">用户名 / 邮箱</label>
          <div class="flex items-center curator-border focus-within:border-primary-container transition-all duration-300">
            <input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body py-3 px-0 placeholder:text-outline/50" placeholder="请输入用户名或邮箱" type="text">
          </div>
        </div>
        <div class="space-y-3">
          <div class="flex justify-between items-end">
            <label class="font-label text-xs uppercase tracking-wider text-secondary">密码</label>
            <span class="text-[11px] text-outline hover:text-primary-container cursor-pointer transition-colors">忘记密码？</span>
          </div>
          <div class="flex items-center curator-border focus-within:border-primary-container transition-all duration-300">
            <input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body py-3 px-0 placeholder:text-outline/50" placeholder="请输入密码" type="password" id="passwordInput">
            <span class="material-symbols-outlined text-[18px] text-outline cursor-pointer hover:text-on-surface" id="togglePassword">visibility_off</span>
          </div>
        </div>
      </div>
    </div>

    <a class="w-full py-5 bg-primary-container text-on-primary rounded-none font-display text-lg font-medium shadow-sm hover:bg-primary transition-all duration-300 flex items-center justify-center" href="pages/viewfinder.html">
      登录
    </a>

    <div class="mt-6 text-center">
      <p class="font-body text-sm text-secondary">
        还没有账号？ <a class="text-primary-container font-medium cursor-pointer hover:underline underline-offset-4" href="pages/register.html">立即注册</a>
      </p>
    </div>

    <div class="pt-4">
      <label class="flex items-start gap-4 cursor-pointer group">
        <div class="relative flex items-center mt-0.5">
          <input class="peer h-4 w-4 rounded-none border-outline-variant bg-transparent text-primary-container focus:ring-primary-container/20 transition-all" type="checkbox">
        </div>
        <span class="font-body text-[13px] text-secondary leading-relaxed">
          我已阅读并同意 <span class="text-on-surface font-medium hover:text-primary-container cursor-pointer underline underline-offset-4 decoration-outline-variant/30">服务协议</span> 和 <span class="text-on-surface font-medium hover:text-primary-container cursor-pointer underline underline-offset-4 decoration-outline-variant/30">隐私政策</span>。
        </span>
      </label>
    </div>
  </div>
</main>

<footer class="pb-12 flex flex-col items-center">
  <div class="flex items-center gap-3 font-label text-[10px] tracking-[0.2em] text-outline/60 uppercase">
    <span class="w-1 h-1 rounded-full bg-primary-container/40"></span>
    SECURE AUTH v1.01
  </div>
</footer>

<script>
  document.getElementById('togglePassword').addEventListener('click', function() {
    const input = document.getElementById('passwordInput');
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    this.textContent = isPassword ? 'visibility' : 'visibility_off';
  });
</script>
</body>
</html>
