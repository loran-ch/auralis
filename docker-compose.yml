services:
  db:
    image: mysql:8.0
    container_name: livetrans-db
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env.production
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.production 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: livetrans_voice
      MYSQL_USER: livetrans
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?请在 .env.production 中配置 MYSQL_APP_PASSWORD}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./004.数据库脚本/01_livetrans_voice_建表.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./004.数据库脚本/02_livetrans_voice_生产基础数据.sql:/docker-entrypoint-initdb.d/02_production_seed.sql:ro
      - ./004.数据库脚本/07_lecture_briefings.sql:/docker-entrypoint-initdb.d/03_briefings.sql:ro
      - ./004.数据库脚本/08_app_guides.sql:/docker-entrypoint-initdb.d/04_guides.sql:ro
      - ./004.数据库脚本/09_classroom_assistant_upgrade.sql:/docker-entrypoint-initdb.d/05_classroom_assistant.sql:ro
      - ./004.数据库脚本/10_record_only_mode.sql:/docker-entrypoint-initdb.d/06_record_only_mode.sql:ro
      - ./004.数据库脚本/11_courses_p0.sql:/docker-entrypoint-initdb.d/07_courses_p0.sql:ro
      - ./004.数据库脚本/12_lecture_titles.sql:/docker-entrypoint-initdb.d/08_lecture_titles.sql:ro
      - ./004.数据库脚本/13_learning_assistant_threads.sql:/docker-entrypoint-initdb.d/09_assistant_threads.sql:ro
      - ./004.数据库脚本/14_classroom_media_p0.sql:/docker-entrypoint-initdb.d/10_classroom_media.sql:ro
      - ./004.数据库脚本/15_media_ocr_verification.sql:/docker-entrypoint-initdb.d/11_media_ocr_verification.sql:ro
      - ./004.数据库脚本/19_public_courses_p0.sql:/docker-entrypoint-initdb.d/12_public_courses.sql:ro
      - ./004.数据库脚本/20_admin_llm_quota_p0.sql:/docker-entrypoint-initdb.d/13_admin_llm_quota.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: livetrans-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    volumes:
      - uploads_data:/app/003.UI/frontend/uploads
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 20s

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
    container_name: livetrans-nginx
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - ./deploy/certbot:/var/www/certbot:ro
      - uploads_data:/usr/share/nginx/uploads:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  mysql_data:
  uploads_data:
