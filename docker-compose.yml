services:
  db:
    image: mysql:8.0
    container_name: livetrans-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: livetrans_voice
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./004.数据库脚本:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: livetrans-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    volumes:
      - uploads_data:/app/frontend/uploads
    ports:
      - "127.0.0.1:8010:8010"

  nginx:
    image: nginx:1.27-alpine
    container_name: livetrans-nginx
    restart: always
    depends_on:
      - backend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/h5_dist:/usr/share/nginx/h5:ro
      - uploads_data:/usr/share/nginx/uploads:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  mysql_data:
  uploads_data:
